            const count = getStarCount(score);
            return (
                <div className="flex gap-0.5 text-yellow-500" title={`${count} Estrelas`}>
                    {[...Array(5)].map((_, i) => (
                        <Icons.Star key={i} filled={i < count} />
                    ))}
                </div>
            );
        };

        const SignaturePad = ({ onSave, initialData, onCancel }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                if(!canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#000"; 
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                
                if (initialData) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = initialData;
                }
            }, []);

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                ctx.beginPath();
                ctx.moveTo(x, y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = () => { setIsDrawing(false); };
            const handleClear = () => { const canvas = canvasRef.current; const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); };
            const handleConfirm = () => { onSave(canvasRef.current.toDataURL()); };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                    <div className="bg-stone-100 border border-stone-300 rounded-xl shadow-2xl w-full max-w-md p-6 animate-in fade-in zoom-in duration-200">
                        <h3 className="text-lg font-bold text-stone-800 mb-4 flex items-center gap-2"><Icons.Pen /> Assinatura do Responsável</h3>
                        <div className="bg-white rounded-lg mb-4 h-48 border border-stone-400 relative overflow-hidden">
                             <canvas ref={canvasRef} className="w-full h-full touch-none" onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} />
                            <div className="absolute bottom-2 right-2 text-xs text-gray-400 pointer-events-none">Assine acima</div>
                        </div>
                        <div className="flex gap-2">
                             <button onClick={onCancel} className="flex-1 py-3 border border-stone-300 rounded-lg text-stone-600 font-bold hover:bg-stone-200 transition-colors">Cancelar</button>
                             <button onClick={handleClear} className="px-4 py-3 border border-stone-300 rounded-lg text-stone-600 font-bold hover:text-red-500 hover:bg-stone-200 transition-colors" title="Limpar"><Icons.Trash /></button>
                             <button onClick={handleConfirm} className="flex-1 py-3 bg-yellow-500 text-stone-900 rounded-lg font-bold hover:bg-yellow-400 shadow-lg shadow-yellow-500/20 transition-colors">Confirmar</button>
                        </div>
                    </div>
                </div>
            );
        };

        const LoginScreen = ({ setUser }) => {
            const toast = useToast();
            const [loading, setLoading] = useState(false);

            const handleGoogleLogin = async () => {
                setLoading(true);
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                    toast("Login efetuado com sucesso!", "success");
                } catch (error) {
                    console.error(error);
                    toast(error.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-screen bg-stone-100 max-w-md mx-auto shadow-2xl relative items-center justify-center p-6 text-stone-900 animate-fade-in">
                    <div className="w-full bg-white p-8 rounded-2xl shadow-lg border border-stone-200">
                        <div className="text-center mb-8">
                            <div className="h-16 w-16 bg-yellow-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-md text-white">
                                <Icons.Check />
                            </div>
                            <h1 className="text-2xl font-black text-stone-800">Checklist Qualidade</h1>
                            <p className="text-sm text-stone-500 font-medium">Acesse o sistema IMAC</p>
                        </div>

                        <button 
                            onClick={handleGoogleLogin} 
                            disabled={loading} 
                            className="w-full py-4 mt-4 bg-white border border-stone-300 text-stone-700 font-bold rounded-lg shadow-sm hover:bg-stone-50 transition-all active:scale-95 flex items-center justify-center gap-3 disabled:opacity-50"
                        >
                            <Icons.Google />
                            {loading ? 'Aguarde...' : 'Entrar com Google'}
                        </button>
                    </div>
                </div>
            );
        };

        function AppContent() {
            const toast = useToast();
            const [user, setUser] = useState(null);
            const [authLoaded, setAuthLoaded] = useState(false);

            const [view, setView] = useState('loading');
            const [selectedSetor, setSelectedSetor] = useState('');
            const [responsavel, setResponsavel] = useState('');
            const [questions, setQuestions] = useState([]);
            const [inspections, setInspections] = useState([]);
            const [logo, setLogo] = useState(null);
            const [lastBackup, setLastBackup] = useState(null);
            const [weekOffset, setWeekOffset] = useState(0); 
            const [lightboxImg, setLightboxImg] = useState(null);
            
            const today = new Date();
            const localISODate = new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            const [inspectionDate, setInspectionDate] = useState(localISODate);
            const [analyticsSelectedDate, setAnalyticsSelectedDate] = useState(localISODate);

            const [inspectionSearch, setInspectionSearch] = useState('');
            const [answers, setAnswers] = useState({});
            const [ncQtys, setNcQtys] = useState({}); 
            const [obs, setObs] = useState({});
            const [evidences, setEvidences] = useState({}); 
            const [signature, setSignature] = useState(null);
            const [isSigning, setIsSigning] = useState(false);
            const [editingInspectionId, setEditingInspectionId] = useState(null);
            const [previousNCs, setPreviousNCs] = useState({});

            const [reportInspection, setReportInspection] = useState(null);
            const [actionPlan, setActionPlan] = useState('');

            const [settingsTab, setSettingsTab] = useState('questions');
            const [analyticsTab, setAnalyticsTab] = useState('weekly'); 
            const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
            const [editingQ, setEditingQ] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');

            // Modal Didático de Clone de Setor
            const [isCloneModalOpen, setIsCloneModalOpen] = useState(false);
            const [cloneSourceSector, setCloneSourceSector] = useState('');
            const [cloneTargetSector, setCloneTargetSector] = useState('');

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(usr => {
                    setUser(usr);
                    setAuthLoaded(true);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!authLoaded) return;
                if (!user) { setView('login'); return; }

                let unsubQuestions;
                let unsubInspections;

                const loadData = async () => {
                    try {
                        setView('loading');
                        
                        // SNAPSHOT PARA MULTIPLOS DISPOSITIVOS! Sincronização em Tempo Real das Perguntas
                        unsubQuestions = db.collection('questions').onSnapshot(snap => {
                            const qList = snap.docs.map(doc => doc.data());
                            if (qList.length === 0 && !window.hasSeededQuestions) {
                                window.hasSeededQuestions = true;
                                STATIC_DB_PERGUNTAS.forEach(p => DB.saveQuestion(p));
                            } else {
                                setQuestions(qList);
                            }
                        });

                        // SNAPSHOT PARA MULTIPLOS DISPOSITIVOS! Sincronização em Tempo Real das Inspeções
                        unsubInspections = db.collection('inspections').onSnapshot(snap => {
                            const iList = snap.docs.map(doc => doc.data());
                            setInspections(iList);
                        });

                        const l = await DB.getConfig('logo');
                        const b = await DB.getConfig('lastBackup');
                        const wo = await DB.getConfig('weekOffset');

                        setLogo(l);
                        setLastBackup(b);
                        setWeekOffset(wo || 0);

                        // Draft no LocalStorage (Mantém a inspeção salva em caso de fechamento do navegador)
                        const draftStr = localStorage.getItem('imac_current_draft');
                        if (draftStr) {
                            const draft = JSON.parse(draftStr);
                            if (draft && draft.selectedSetor) {
                                setSelectedSetor(draft.selectedSetor);
                                setResponsavel(draft.responsavel);
                                setInspectionDate(draft.inspectionDate);
                                setAnswers(draft.answers || {});
                                setNcQtys(draft.ncQtys || {});
                                setObs(draft.obs || {});
                                setEvidences(draft.evidences || {});
                                setSignature(draft.signature);
                                setEditingInspectionId(draft.editingInspectionId);
                                setPreviousNCs(draft.previousNCs || {});
                                setView('inspection');
                                toast("Inspeção restaurada automaticamente.", 'success');
                                return;
                            }
                        }
                        
                        setView('dashboard');

                    } catch (e) {
                        console.error("Erro ao carregar DB Firestore", e);
                        toast("Erro ao carregar banco de dados na nuvem.", 'error');
                        setView('dashboard');
                    }
                };
                
                loadData();

                // Cleanup function
                return () => {
                    if (unsubQuestions) unsubQuestions();
                    if (unsubInspections) unsubInspections();
                };
            }, [user, authLoaded]);

            // Save Draft to LocalStorage
            useEffect(() => {
                if (view !== 'inspection' || !selectedSetor) return;
                const timer = setTimeout(() => {
                    const draft = { selectedSetor, responsavel, inspectionDate, answers, ncQtys, obs, evidences, signature, editingInspectionId, previousNCs };
                    localStorage.setItem('imac_current_draft', JSON.stringify(draft));
                }, 1000); 
                return () => clearTimeout(timer);
            }, [view, selectedSetor, responsavel, inspectionDate, answers, ncQtys, obs, evidences, signature, editingInspectionId, previousNCs]);

            const currentWeekId = getWeekID(localISODate, weekOffset);
            const weekId = getWeekID(inspectionDate); 
            
            const allSetors = useMemo(() => {
                const s = new Set(questions.map(p => p.setor).filter(x => x !== 'TODOS'));
                return Array.from(s).sort();
            }, [questions]);

            const inspectionsThisWeek = useMemo(() => {
                return inspections.filter(i => i.weekId === currentWeekId);
            }, [inspections, currentWeekId]);

            const setoresConcluidos = useMemo(() => new Set(inspectionsThisWeek.map(i => i.setor)), [inspectionsThisWeek]);

            const progress = useMemo(() => {
                const total = allSetors.length;
                const done = setoresConcluidos.size;
                const pct = total === 0 ? 0 : Math.round((done / total) * 100);
                return { total, done, pct };
            }, [allSetors, setoresConcluidos]);

            const currentQuestions = useMemo(() => {
                if (!selectedSetor) return [];
                return questions.filter(p => p.setor === selectedSetor || p.setor === 'TODOS');
            }, [selectedSetor, questions]);

            const scores = useMemo(() => {
                if (currentQuestions.length === 0) return { real: 0, bonus: 0 };
                let totalReal = 0, conformesReal = 0, totalBonus = 0, conformesBonus = 0;

                currentQuestions.forEach(q => {
                    const resp = answers[q.id];
                    if (resp && resp !== 'NA') {
                        const weight = q.weight || 1;
                        if (resp === 'C') {
                            totalReal += weight;
                            conformesReal += weight;
                            if (q.grupo !== 'ESTRUTURAL') { totalBonus += weight; conformesBonus += weight; }
                        } else if (resp === 'NC') {
                            const qty = ncQtys[q.id] || 1;
                            totalReal += (weight * qty);
                            if (q.grupo !== 'ESTRUTURAL') totalBonus += (weight * qty);
                        }
                    }
                });

                return {
                    real: totalReal === 0 ? 0 : Math.round((conformesReal / totalReal) * 100),
                    bonus: totalBonus === 0 ? 0 : Math.round((conformesBonus / totalBonus) * 100)
                };
            }, [answers, ncQtys, currentQuestions]);

            const handleLogout = async () => {
                await auth.signOut();
                toast("Você saiu do sistema.");
            }

            const handleStartInspection = (setor) => {
                if (!responsavel) { toast("Informe o responsável para iniciar.", 'error'); return; }
                setSelectedSetor(setor);
                setAnswers({});
                setNcQtys({});
                setObs({});
                setEvidences({});
                setSignature(null);
                setEditingInspectionId(null);
                setInspectionSearch('');
                const now = new Date();
                now.setDate(now.getDate() + (weekOffset * 7));
                const localDate = getLocalDateString(now);
                setInspectionDate(localDate);
                
                const sortedInspections = inspections
                    .filter(i => i.setor === setor)
                    .sort((a, b) => new Date(b.data) - new Date(a.data));
                
                const lastInsp = sortedInspections[0];
                const prevNCsMap = {};
                if (lastInsp) {
                    Object.entries(lastInsp.respostas).forEach(([qId, val]) => {
                        if(val === 'NC') { prevNCsMap[qId] = lastInsp.observacoes[qId] || "Sem observação"; }
                    });
                }
                setPreviousNCs(prevNCsMap);
                setView('inspection');
            };

            const handleDeleteAudit = async (id) => {
                if (!confirm("Tem certeza que deseja apagar este registro do sistema (Nuvem)?")) return;
                await DB.deleteInspection(id);
                // setInspections não é mais necessário aqui, o onSnapshot cuida da atualização em tempo real
                toast("Inspeção apagada com sucesso.");
            };

            const handlePhotoUpload = (qId, e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; 
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressedBase64 = canvas.toDataURL("image/jpeg", 0.6); 
                        setEvidences(prev => {
                            const currentList = prev[qId] ? (Array.isArray(prev[qId]) ? prev[qId] : [prev[qId]]) : [];
                            return { ...prev, [qId]: [...currentList, compressedBase64] };
                        });
                        toast("Foto adicionada!", 'success');
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            };

            const removePhoto = (qId, index) => {
                setEvidences(prev => {
                    const currentList = prev[qId] ? (Array.isArray(prev[qId]) ? prev[qId] : [prev[qId]]) : [];
                    const newList = currentList.filter((_, i) => i !== index);
                    return { ...prev, [qId]: newList };
                });
            };

            const handleSaveSignature = (sigData) => {
                setSignature(sigData);
                setIsSigning(false);
            };

            const handleSaveInspection = async () => {
                try {
                    const pendentes = currentQuestions.filter(q => !answers[q.id]);
                    if (pendentes.length > 0 && !confirm(`Existem ${pendentes.length} perguntas sem resposta. Salvar mesmo assim?`)) return;
                    if (!signature && !confirm("Salvar sem assinatura?")) return;

                    toast("Sincronizando com a nuvem...", "success");

                    const targetWeekId = getWeekID(inspectionDate, 0); 
                    const dataIsoSalva = inspectionDate + 'T12:00:00.000Z';

                    const newInspection = {
                        id: editingInspectionId || Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        setor: selectedSetor,
                        responsavel: responsavel,
                        data: dataIsoSalva,
                        weekId: targetWeekId,
                        score: scores.real,
                        bonusScore: scores.bonus,
                        respostas: answers,
                        ncQtys: ncQtys,
                        observacoes: obs,
                        evidencias: evidences,
                        assinatura: signature,
                        status: 'Concluído'
                    };

                    await DB.saveInspection(newInspection);
                    localStorage.removeItem('imac_current_draft'); 
                    
                    const ncs = Object.entries(newInspection.respostas).filter(([_, v]) => v === 'NC');
                    let sugestao = "Parabéns! Nenhuma não conformidade detectada.";
                    
                    if (ncs.length > 0) {
                        sugestao = ncs.map(([qid]) => {
                            const q = questions.find(qu => qu.id === qid);
                            return `- Resolver NC em ${q?.grupo || 'Geral'}: ${q?.pergunta || 'Item'} (Obs: ${newInspection.observacoes[qid] || ' '})`;
                        }).join('\n');
                    }
                    setActionPlan(sugestao);

                    setReportInspection(newInspection);
                    setView('report');
                    toast("Inspeção salva com sucesso no Firebase!");
                } catch (e) {
                    console.error(e);
                    toast("Erro ao salvar na nuvem. Verifique sua conexão.", 'error');
                }
            };

            const handleCancelInspection = () => {
                 if (confirm("Deseja cancelar esta inspeção? Todos os dados não salvos serão perdidos.")) {
                     localStorage.removeItem('imac_current_draft'); 
                     setView('dashboard');
                 }
            };

            const handleSaveQuestion = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const weight = parseInt(formData.get('weight')) || 1;
                const newQ = {
                    id: editingQ?.id || Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    setor: formData.get('setor').toUpperCase(),
                    grupo: formData.get('grupo').toUpperCase(),
                    pergunta: formData.get('pergunta'),
                    critical: formData.get('critical') === 'on',
                    weight: weight
                };
                
                await DB.saveQuestion(newQ);
                setIsModalOpen(false);
                setEditingQ(null);
                toast("Pergunta salva na Nuvem.");
            };

            // LOGICA DIDÁTICA PARA CLONAR SETOR
            const handleCloneSector = async (e) => {
                e.preventDefault();
                if (!cloneSourceSector || !cloneTargetSector) {
                    toast("Preencha os campos obrigatórios.", "error");
                    return;
                }

                const newSectorName = cloneTargetSector.toUpperCase();
                const sourceQuestions = questions.filter(q => q.setor === cloneSourceSector);

                if (sourceQuestions.length === 0) {
                    toast("O setor de origem não possui perguntas.", "error");
                    return;
                }

                if (allSetors.includes(newSectorName)) {
                    if (!confirm(`O setor ${newSectorName} já existe. Deseja adicionar as perguntas a ele mesmo assim?`)) return;
                }

                toast("Clonando setor, aguarde...");

                try {
                    for (let q of sourceQuestions) {
                        const newQ = {
                            ...q,
                            id: Date.now().toString() + Math.random().toString(36).substr(2, 6),
                            setor: newSectorName
                        };
                        await DB.saveQuestion(newQ);
                    }
                    setIsCloneModalOpen(false);
                    setCloneSourceSector('');
                    setCloneTargetSector('');
                    toast(`Setor ${newSectorName} criado com as perguntas!`, "success");
                } catch (err) {
                    console.error(err);
                    toast("Erro ao clonar perguntas.", "error");
                }
            };

            const handleDeleteQuestion = async (id) => {
                if(confirm("Tem certeza que deseja apagar essa pergunta definitivamente?")) {
                    await DB.deleteQuestion(id);
                    toast("Pergunta apagada.");
                }
            };

            const handleNextWeek = async () => {
                if (confirm("Deseja iniciar a próxima semana de auditorias?\n\nA data base do sistema avançará 1 semana.")) {
                    const newOffset = weekOffset + 1;
                    await DB.setConfig('weekOffset', newOffset);
                    setWeekOffset(newOffset);
                    toast("Nova semana iniciada!", 'success');
                }
            };

            // LÓGICA DE MIGRAÇÃO DO BACKUP ANTIGO (JSON) PARA A NUVEM
            const handleRestoreBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        toast("Sincronizando dados com a nuvem... Isso pode levar alguns segundos.", "success");
                        const data = JSON.parse(event.target.result);
                        
                        // Envia as perguntas antigas para o Firebase
                        if (data.questions && Array.isArray(data.questions)) {
                            for (const q of data.questions) {
                                await DB.saveQuestion(q);
                            }
                        }
                        
                        // Envia as inspeções antigas para o Firebase
                        if (data.inspections && Array.isArray(data.inspections)) {
                            for (const insp of data.inspections) {
                                await DB.saveInspection(insp);
                            }
                        }

                        if (data.logo) { await DB.setConfig('logo', data.logo); setLogo(data.logo); }
                        if (data.weekOffset !== undefined) { await DB.setConfig('weekOffset', data.weekOffset); setWeekOffset(data.weekOffset); }
                        
                        toast("Backup antigo migrado para a Nuvem com sucesso!", "success");
                    } catch (err) {
                        console.error(err);
                        toast("Erro ao restaurar backup. Arquivo inválido.", 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = null; // Reseta o input de arquivo
            };

            const handleExportCSV = () => {
                const headers = ["ID", "Data", "Semana", "Setor", "Responsavel", "Nota", "Questão", "Grupo", "Peso", "Resposta", "Qtd Penalidades", "Observação"];
                const rows = [];
                inspections.forEach(insp => {
                    Object.entries(insp.respostas).forEach(([qId, resp]) => {
                        const q = questions.find(qu => qu.id === qId);
                        const qty = (insp.ncQtys && insp.ncQtys[qId]) || 1;
                        rows.push([
                            insp.id, new Date(insp.data).toLocaleDateString(), insp.weekId, insp.setor, insp.responsavel, insp.score,
                            q ? q.pergunta.replace(/;/g, ',') : 'Questão removida', q ? q.grupo : '-', q ? (q.weight || 1) : 1,
                            resp, resp === 'NC' ? qty : '-', (insp.observacoes[qId] || '').replace(/;/g, ',')
                        ]);
                    });
                });

                const csvContent = "data:text/csv;charset=utf-8," + headers.join(";") + "\n" + rows.map(e => e.join(";")).join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "imac_dados_brutos.csv");
                document.body.appendChild(link);
                link.click();
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = async () => {
                    await DB.setConfig('logo', reader.result);
                    setLogo(reader.result);
                    toast("Logo salva na nuvem.");
                };
                reader.readAsDataURL(file);
            };

            const handleDownloadPDF = (elementId, filename, isLandscape = false) => {
                const element = document.getElementById(elementId);
                const opt = {
                    margin: 5, filename: filename, image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: isLandscape ? 'landscape' : 'portrait' }
                };
                if (window.html2pdf) { window.html2pdf().set(opt).from(element).save(); } 
                else { toast("Biblioteca PDF não carregada.", 'error'); }
            };

            const filteredInspectionQuestions = useMemo(() => {
                if (!inspectionSearch) return currentQuestions;
                const lower = inspectionSearch.toLowerCase();
                return currentQuestions.filter(q => q.pergunta.toLowerCase().includes(lower) || q.grupo.toLowerCase().includes(lower));
            }, [currentQuestions, inspectionSearch]);

            const analytics = useMemo(() => {
                let filteredInspections = [];
                if (analyticsTab === 'weekly') {
                    const targetWeekId = getWeekID(analyticsSelectedDate);
                    filteredInspections = inspections.filter(i => i.weekId === targetWeekId);
                } else {
                    filteredInspections = inspections.filter(i => i.data.startsWith(selectedMonth));
                }

                const totalScore = filteredInspections.reduce((acc, curr) => acc + (curr.score || 0), 0);
                const avgScore = filteredInspections.length ? Math.round(totalScore / filteredInspections.length) : 0;
                
                const totalBonusScore = filteredInspections.reduce((acc, curr) => acc + (curr.bonusScore !== undefined ? curr.bonusScore : curr.score || 0), 0);
                const avgBonusScore = filteredInspections.length ? Math.round(totalBonusScore / filteredInspections.length) : 0;

                const grouped = {};
                filteredInspections.forEach(i => {
                    if(!grouped[i.setor]) grouped[i.setor] = { total: 0, count: 0 };
                    grouped[i.setor].total += (i.bonusScore !== undefined ? i.bonusScore : i.score || 0);
                    grouped[i.setor].count += 1;
                });
                
                let ranking = Object.entries(grouped).map(([setor, val]) => ({
                    setor, score: Math.round(val.total / val.count), count: val.count
                })).sort((a, b) => b.score - a.score);

                const ncBySector = {};
                const ncByCategory = {};
                const auditorScores = {}; 

                filteredInspections.forEach(insp => {
                    if (!auditorScores[insp.responsavel]) auditorScores[insp.responsavel] = { total: 0, count: 0 };
                    auditorScores[insp.responsavel].total += (insp.bonusScore !== undefined ? insp.bonusScore : insp.score || 0);
                    auditorScores[insp.responsavel].count += 1;

                    if(insp.respostas) {
                        Object.entries(insp.respostas).forEach(([qId, resp]) => {
                            if (resp === 'NC') {
                                const qty = (insp.ncQtys && insp.ncQtys[qId]) || 1;
                                ncBySector[insp.setor] = (ncBySector[insp.setor] || 0) + qty;
                                const question = questions.find(q => q.id === qId);
                                if (question) { ncByCategory[question.grupo] = (ncByCategory[question.grupo] || 0) + qty; }
                            }
                        });
                    }
                });

                const colors = ['#eab308', '#a8a29e', '#f59e0b', '#78716c', '#ef4444', '#84cc16', '#3b82f6', '#d946ef'];
                const pieSector = Object.entries(ncBySector).map(([label, value], i) => ({ label, value, color: colors[i % colors.length] })).sort((a, b) => b.value - a.value); 
                const pieCategory = Object.entries(ncByCategory).map(([label, value], i) => ({ label, value, color: colors[i % colors.length] })).sort((a, b) => b.value - a.value); 
                const auditorPerformance = Object.entries(auditorScores).map(([name, val]) => ({ name, avg: Math.round(val.total / val.count), count: val.count })).sort((a, b) => b.avg - a.avg);

                const totalInspections = filteredInspections.length;
                const bestSector = ranking.length > 0 ? ranking[0].setor : "Nenhum";
                const worstSector = ranking.length > 0 ? ranking[ranking.length - 1].setor : "Nenhum";
                const mainIssue = pieCategory.length > 0 ? pieCategory[0].label : "Nenhum";
                const summaryText = `Neste período (${analyticsTab === 'weekly' ? 'Semana' : 'Mês'}), foram realizadas ${totalInspections} inspeções, resultando em uma média global de ${avgScore}%. O setor com melhor desempenho foi "${bestSector}", enquanto "${worstSector}" apresentou os menores índices. A principal categoria de não conformidades foi "${mainIssue}".`;

                return { avgScore, avgBonusScore, ranking, pieSector, pieCategory, auditorPerformance, summaryText, filteredInspections };
            }, [inspections, questions, weekId, analyticsTab, selectedMonth, analyticsSelectedDate]);

            // EXPORT EXCEL LOGIC...
            const handleExportManagementExcel = () => {
                if (!window.XLSX) { toast("Biblioteca XLSX não carregada.", "error"); return; }
                const wb = XLSX.utils.book_new();
                const periodoName = analyticsTab === 'weekly' ? 'Semanal' : 'Mensal';
                
                // Resumo Executivo
                const wsResumoData = [ ["Relatório Gerencial - Gestão de Qualidade IMAC"], ["Data de Emissão", new Date().toLocaleDateString()], ["Período Analisado", analyticsTab === 'weekly' ? getWeekRangeFromDate(analyticsSelectedDate) : selectedMonth], [], ["MÉTRICAS GERAIS"], ["Média Geral", `${analytics.avgScore}%`], ["Média Gratificação", `${analytics.avgBonusScore}%`], ["Total de Inspeções", analytics.ranking.length], ["Maior Incidência (NC)", analytics.pieCategory.length > 0 ? analytics.pieCategory[0].label : "N/A"], [], ["RESUMO EXECUTIVO"], [analytics.summaryText] ];
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsResumoData), "Resumo");

                // Ranking
                const wsRankingData = [["Posição", "Setor", "Nota Média (Gratificação)"]];
                analytics.ranking.forEach((r, idx) => { wsRankingData.push([idx + 1, r.setor, `${r.score}%`]); });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsRankingData), "Ranking Geral");

                XLSX.writeFile(wb, `Relatorio_Gerencial_${periodoName}_IMAC.xlsx`);
                toast("Relatório Excel exportado!", "success");
            };

            if (!authLoaded || view === 'loading') return <div className="flex h-screen bg-stone-100 items-center justify-center flex-col gap-4"><div className="animate-spin rounded-full h-12 w-12 border-b-4 border-yellow-500"></div><p className="text-stone-500 font-bold animate-pulse">Carregando Sistema da Nuvem...</p></div>;
            if (view === 'login') return <LoginScreen setUser={setUser} />;

            return (
                <div className={view === 'management_report' || view === 'report' ? "min-h-screen bg-white" : "max-w-md mx-auto min-h-screen bg-stone-100 flex flex-col text-stone-900 shadow-2xl relative"}>
                    
                    {view !== 'management_report' && view !== 'report' && <Lightbox src={lightboxImg} onClose={() => setLightboxImg(null)} />}

                    {/* DASHBOARD */}
                    {view === 'dashboard' && (
                        <>
                            <header className="bg-gradient-to-b from-yellow-500 to-yellow-600 text-stone-900 p-6 rounded-b-3xl shadow-lg mb-6 relative border-b border-yellow-600/30">
                                <div className="absolute top-6 right-6 flex gap-2">
                                    <button onClick={() => { setSettingsTab('history'); setView('settings'); }} className="p-2 bg-white/30 rounded-full hover:bg-white/50 transition-colors" title="Histórico"><Icons.History /></button>
                                    <button onClick={() => setView('analytics')} className="p-2 bg-white/30 rounded-full hover:bg-white/50 transition-colors" title="Indicadores"><Icons.Chart /></button>
                                    <button onClick={() => setView('settings')} className="p-2 bg-white/30 rounded-full hover:bg-white/50 transition-colors" title="Configurações"><Icons.Gear /></button>
                                    <button onClick={handleLogout} className="p-2 bg-red-500/20 text-red-900 rounded-full hover:bg-red-500/40 transition-colors" title="Sair"><Icons.Logout /></button>
                                </div>
                                <div className="mb-4">
                                    {logo ? <img src={logo} alt="Logo" className="h-16 object-contain mb-2 drop-shadow-md" /> : <h1 className="text-2xl font-bold text-stone-900">Checklist</h1>}
                                    <p className="text-stone-800 text-sm font-medium">Controle de Qualidade</p>
                                </div>
                                <div className="bg-white/90 backdrop-blur-md p-4 rounded-xl border border-yellow-200 shadow-sm">
                                    <div className="flex justify-between items-end mb-2"><span className="text-stone-600 text-sm font-bold">Progresso Semanal</span><span className="text-2xl font-bold text-yellow-600">{progress.pct}%</span></div>
                                    <div className="w-full bg-stone-200 rounded-full h-3 mb-2"><div className="bg-yellow-500 h-3 rounded-full transition-all duration-1000" style={{ width: `${progress.pct}%` }}></div></div>
                                    <p className="text-xs text-stone-500 text-right font-medium">{progress.done}/{progress.total} setores verificados</p>
                                </div>
                            </header>
                            <main className="flex-1 px-6 pb-20 animate-fade-in">
                                <div className="mb-6"><label className="block text-sm font-bold text-stone-700 mb-2">Responsável</label><input type="text" value={responsavel} onChange={(e) => setResponsavel(e.target.value)} placeholder="Digite seu nome..." className="w-full p-3 rounded-xl bg-white border border-stone-300 text-stone-900 shadow-sm outline-none focus:ring-2 focus:ring-yellow-500 transition-all" /></div>
                                
                                {progress.pct === 100 && (
                                    <div className="mb-6 p-5 bg-green-50 rounded-xl border border-green-200 text-center animate-fade-in shadow-sm">
                                        <h3 className="text-green-700 font-bold text-lg mb-2">🎉 Semana Concluída!</h3>
                                        <p className="text-green-800 text-xs mb-4">Todos os setores foram verificados.</p>
                                        <div className="flex flex-col gap-2">
                                            <button onClick={() => setView('management_report')} className="w-full py-3 bg-green-600 text-white font-bold rounded-lg shadow hover:bg-green-500 transition-all flex items-center justify-center gap-2"><Icons.FileText /> Ver Relatório Semanal</button>
                                            <button onClick={handleNextWeek} className="w-full py-3 bg-white border border-green-600 text-green-700 font-bold rounded-lg hover:bg-green-50 transition-all flex items-center justify-center gap-2 text-xs"><Icons.ArrowRight /> Iniciar Próxima Semana</button>
                                        </div>
                                    </div>
                                )}

                                <div className="space-y-3">
                                    {allSetors.map(setor => {
                                        const isDone = setoresConcluidos.has(setor);
                                        const insp = inspectionsThisWeek.find(i => i.setor === setor);
                                        const displayScore = insp ? (insp.bonusScore !== undefined ? insp.bonusScore : insp.score) : 0;
                                        
                                        return (
                                            <button key={setor} onClick={() => isDone ? (setReportInspection(insp), setView('report')) : handleStartInspection(setor)} className={`w-full p-4 rounded-xl flex items-center justify-between card-shadow transition-all active:scale-95 border ${isDone ? 'bg-white border-yellow-500 shadow-md' : 'bg-white border-stone-200 hover:border-stone-400'}`}>
                                                <div className="flex items-center gap-3">
                                                    <div className={`h-10 w-10 rounded-full flex items-center justify-center ${isDone ? 'bg-yellow-100 text-yellow-700' : 'bg-stone-100 text-stone-500'}`}>{isDone ? <Icons.Check /> : <Icons.List />}</div>
                                                    <div className="text-left"><p className={`font-bold ${isDone ? 'text-stone-900' : 'text-stone-700'}`}>{setor}</p>{isDone && <div className="flex gap-2 items-center"><p className={`text-xs font-bold ${displayScore >= 85 ? 'text-green-600' : 'text-red-600'}`}>Nota: {displayScore}%</p><StarRating score={displayScore} /></div>}</div>
                                                </div>
                                                {isDone ? <span className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded font-bold border border-yellow-200">RELATÓRIO</span> : <span className="h-8 w-8 rounded-full bg-stone-100 text-stone-400 flex items-center justify-center hover:bg-stone-200 transition-colors">→</span>}
                                            </button>
                                        );
                                    })}
                                </div>
                            </main>
                        </>
                    )}

                    {/* VIEW INSPECTION */}
                    {view === 'inspection' && (
                        <div className="flex flex-col h-screen">
                            <header className="sticky top-0 z-20 bg-white border-b border-stone-200 px-6 py-4 shadow-md">
                                <div className="flex justify-between items-start mb-2">
                                    <div><h2 className="text-lg font-bold text-stone-800">{selectedSetor}</h2><p className="text-xs text-stone-500">Resp: {responsavel}</p></div>
                                    <div className="text-right flex flex-col items-end">
                                        <label className="text-[10px] text-stone-400 font-bold uppercase">Data</label>
                                        <input type="date" value={inspectionDate} onChange={(e) => setInspectionDate(e.target.value)} className="bg-transparent text-stone-600 text-sm font-bold text-right outline-none" />
                                    </div>
                                </div>
                                <div className="flex justify-between items-center pt-2 border-t border-stone-200 mt-2">
                                    <div className="text-center w-1/2 border-r border-stone-200"><span className={`text-2xl font-black ${scores.real >= 85 ? 'text-green-600' : 'text-red-600'}`}>{scores.real}%</span><span className="text-[10px] font-bold text-stone-400 block uppercase">Real</span></div>
                                    <div className="text-center w-1/2"><span className="text-xl font-bold text-yellow-600">{scores.bonus}%</span><span className="text-[10px] font-bold text-yellow-700 block uppercase">Bônus</span></div>
                                </div>
                            </header>
                            
                            <div className="bg-stone-100 p-4 pb-2 sticky top-[130px] z-10">
                                <div className="relative shadow-sm">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400"><Icons.Search /></div>
                                    <input type="text" value={inspectionSearch} onChange={(e) => setInspectionSearch(e.target.value)} placeholder="Busca rápida..." className="w-full pl-10 p-3 bg-white border border-stone-300 rounded-xl text-stone-800 outline-none focus:border-yellow-500" />
                                </div>
                            </div>

                            <main className="flex-1 p-6 pt-2 space-y-6 overflow-y-auto pb-24">
                                {filteredInspectionQuestions.map((q, idx) => {
                                    const prevNC = previousNCs[q.id];
                                    return (
                                    <div key={q.id} className="animate-fade-in bg-white p-4 rounded-xl shadow-sm border border-stone-100">
                                        <div className="mb-2">
                                            <div className="flex gap-2">
                                                <span className="text-[10px] font-bold text-yellow-700 bg-yellow-100 border border-yellow-200 px-2 py-1 rounded uppercase">{q.grupo}</span>
                                                {q.critical && <span className="text-[10px] font-bold text-white bg-red-600 px-2 py-1 rounded uppercase flex items-center gap-1"><Icons.Alert /> CRÍTICO</span>}
                                                <span className="text-[10px] font-bold text-stone-600 bg-stone-200 px-2 py-1 rounded uppercase">Peso: {q.weight || 1}</span>
                                            </div>
                                            <p className="mt-2 text-stone-800 font-medium leading-snug">{q.pergunta}</p>
                                        </div>
                                        {prevNC && <div className="mb-3 p-2 bg-yellow-50 border-l-2 border-yellow-400 rounded-r text-xs text-yellow-800 flex gap-2"><Icons.Alert /><div><span className="font-bold">Recorrente:</span> "{prevNC}"</div></div>}
                                        <div className="flex gap-2">
                                            {['C', 'NC', 'NA'].map(opt => (
                                                <button key={opt} onClick={() => setAnswers(p => ({...p, [q.id]: opt}))} className={`flex-1 py-3 rounded-lg font-bold text-sm shadow-sm ${answers[q.id] === opt ? (opt === 'C' ? 'bg-green-600 text-white' : opt === 'NC' ? 'bg-red-600 text-white' : 'bg-stone-500 text-white') : 'bg-white border border-stone-300 text-stone-500'}`}>{opt}</button>
                                            ))}
                                        </div>
                                        {answers[q.id] === 'NC' && (
                                            <div className="mt-2 space-y-2 animate-fade-in">
                                                <div className="flex items-center justify-between bg-red-50 p-3 rounded-lg border border-red-200">
                                                    <div className="flex items-center gap-2"><Icons.Alert /><span className="text-xs font-bold text-red-800">Qtd Penalidades:</span></div>
                                                    <div className="flex items-center">
                                                        <button onClick={() => setNcQtys(p => ({...p, [q.id]: Math.max(1, (p[q.id] || 1) - 1)}))} className="w-8 h-8 bg-red-200 text-red-800 font-bold">-</button>
                                                        <input type="number" min="1" value={ncQtys[q.id] || 1} onChange={(e) => setNcQtys(p => ({...p, [q.id]: Math.max(1, parseInt(e.target.value) || 1)}))} className="w-12 h-8 text-center border-y border-red-200 text-red-800 font-bold outline-none" />
                                                        <button onClick={() => setNcQtys(p => ({...p, [q.id]: (p[q.id] || 1) + 1}))} className="w-8 h-8 bg-red-200 text-red-800 font-bold">+</button>
                                                    </div>
                                                </div>
                                                <input type="text" placeholder="Descreva o problema..." value={obs[q.id] || ''} onChange={(e) => setObs(p => ({...p, [q.id]: e.target.value}))} className="w-full text-sm p-3 bg-red-50 border-red-200 rounded-lg text-red-800 focus:border-red-400 outline-none border" />
                                                {evidences[q.id] && evidences[q.id].length > 0 && (
                                                    <div className="flex gap-2 overflow-x-auto py-2">
                                                        {evidences[q.id].map((img, i) => (
                                                            <div key={i} className="relative w-16 h-16 shrink-0 cursor-pointer" onClick={() => setLightboxImg(img)}>
                                                                <img src={img} className="w-full h-full object-cover rounded border border-stone-300" />
                                                                <button onClick={(e) => {e.stopPropagation(); removePhoto(q.id, i)}} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5 shadow-md w-5 h-5 font-bold">x</button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                                <div className="flex gap-2">
                                                    <label className="flex-1 flex items-center justify-center gap-2 py-3 rounded-lg border border-dashed border-stone-400 text-stone-600 bg-white hover:bg-stone-50 cursor-pointer shadow-sm"><input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handlePhotoUpload(q.id, e)} /><Icons.Camera /> <span className="text-xs font-bold">Câmera</span></label>
                                                    <label className="flex-1 flex items-center justify-center gap-2 py-3 rounded-lg border border-dashed border-stone-400 text-stone-600 bg-white hover:bg-stone-50 cursor-pointer shadow-sm"><input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhotoUpload(q.id, e)} /><Icons.Image /> <span className="text-xs font-bold">Galeria</span></label>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    );})
                                }
                                <div className="mt-8 border-t border-stone-300 pt-6 bg-white p-4 rounded-xl">
                                    <h3 className="text-sm font-bold text-stone-700 mb-2 flex items-center gap-2"><Icons.Pen /> Assinatura</h3>
                                    <button type="button" onClick={() => setIsSigning(true)} className={`w-full py-3 rounded-lg border flex items-center justify-center gap-2 ${signature ? 'bg-green-50 text-green-600 border-green-500' : 'bg-white text-stone-600 border-stone-300 hover:bg-stone-50'}`}>
                                        {signature ? <><Icons.Check /> Assinatura Registrada</> : <><Icons.Pen /> Assinar</>}
                                    </button>
                                    {signature && <img src={signature} className="mt-2 h-12 object-contain opacity-70" />}
                                </div>
                            </main>
                            <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-stone-200 flex gap-3 max-w-md mx-auto shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-30">
                                <button onClick={handleCancelInspection} className="px-6 py-3 rounded-xl border border-stone-300 font-bold text-stone-500 hover:bg-stone-50">Cancelar</button>
                                <button onClick={handleSaveInspection} className="flex-1 bg-yellow-500 text-white rounded-xl font-bold shadow-lg hover:bg-yellow-600">Salvar na Nuvem</button>
                            </div>
                        </div>
                    )}

                    {/* SETTINGS */}
                    {view === 'settings' && (
                        <div className="min-h-screen bg-stone-100 flex flex-col">
                            <header className="bg-white p-4 flex items-center justify-between sticky top-0 z-10 shadow-md border-b border-stone-200">
                                <button onClick={() => setView('dashboard')} className="text-sm font-bold text-stone-500 hover:text-yellow-600">← Voltar</button>
                                <h1 className="font-bold text-yellow-600">Configurações</h1>
                                <div className="w-10"></div>
                            </header>
                            <div className="flex border-b border-stone-200 bg-white sticky top-[60px] z-10">
                                <button onClick={() => setSettingsTab('history')} className={`flex-1 py-3 text-sm font-bold border-b-2 transition-colors ${settingsTab === 'history' ? 'border-yellow-500 text-yellow-600' : 'border-transparent text-stone-500'}`}>Histórico</button>
                                <button onClick={() => setSettingsTab('questions')} className={`flex-1 py-3 text-sm font-bold border-b-2 transition-colors ${settingsTab === 'questions' ? 'border-yellow-500 text-yellow-600' : 'border-transparent text-stone-500'}`}>Perguntas</button>
                                <button onClick={() => setSettingsTab('system')} className={`flex-1 py-3 text-sm font-bold border-b-2 transition-colors ${settingsTab === 'system' ? 'border-yellow-500 text-yellow-600' : 'border-transparent text-stone-500'}`}>Sistema</button>
                            </div>
                            <main className="flex-1 p-6 pb-24 space-y-4">
                                {settingsTab === 'system' && (
                                    <div className="space-y-6 animate-fade-in">
                                        
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                                            <h2 className="font-bold text-stone-800 mb-4 flex items-center gap-2"><Icons.Upload /> Migrar Backup Antigo (JSON)</h2>
                                            <p className="text-xs text-stone-500 mb-4">Selecione o arquivo de backup (.json) da versão anterior para enviar todas as suas inspeções e perguntas antigas para a nuvem.</p>
                                            <label className="w-full py-3 bg-stone-800 text-white font-bold rounded-lg shadow hover:bg-stone-700 flex items-center justify-center gap-2 cursor-pointer transition-all active:scale-95">
                                                <Icons.Upload /> Selecionar Arquivo JSON
                                                <input type="file" accept=".json" className="hidden" onChange={handleRestoreBackup} />
                                            </label>
                                        </div>

                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                                            <h2 className="font-bold text-stone-800 mb-4 flex items-center gap-2"><Icons.Database /> Banco em Nuvem Ativo</h2>
                                            <p className="text-xs text-stone-500">Seus dados estão protegidos e sendo salvos e sincronizados no Firebase do IMAC em tempo real.</p>
                                        </div>
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                                            <h2 className="font-bold text-stone-800 mb-4 flex items-center gap-2"><Icons.Excel /> Exportação de Dados</h2>
                                            <button onClick={handleExportCSV} className="w-full py-3 bg-green-600 text-white font-bold rounded-lg shadow hover:bg-green-700 flex items-center justify-center gap-2"><Icons.Download /> Baixar CSV / Excel</button>
                                        </div>
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                                            <h2 className="font-bold text-stone-800 mb-4 flex items-center gap-2"><Icons.Image /> Logo</h2>
                                            <label className="block w-full p-4 border-2 border-dashed border-stone-300 rounded-lg text-center cursor-pointer hover:bg-stone-50">
                                                <input type="file" accept="image/*" onChange={handleLogoUpload} className="hidden" />
                                                {logo ? <img src={logo} className="h-12 mx-auto object-contain" /> : <span className="text-stone-400 text-xs font-bold">Clique para enviar logo</span>}
                                            </label>
                                        </div>
                                    </div>
                                )}
                                {settingsTab === 'questions' && (
                                    <div className="space-y-4">
                                        <div className="flex gap-2">
                                            <div className="relative flex-1">
                                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400"><Icons.Search /></div>
                                                <input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="Buscar pergunta..." className="w-full pl-10 p-3 bg-white border border-stone-300 rounded-xl outline-none focus:border-yellow-500" />
                                            </div>
                                            <button onClick={() => setIsCloneModalOpen(true)} className="px-4 bg-stone-800 text-white font-bold rounded-xl flex items-center gap-2 hover:bg-stone-700 shadow-sm transition-colors text-xs" title="Copiar perguntas de um setor para outro">
                                                <Icons.Copy /> Clonar
                                            </button>
                                        </div>

                                        <div className="space-y-3">
                                            {questions.filter(q => q.pergunta.toLowerCase().includes(searchTerm.toLowerCase())).map(q => (
                                                <div key={q.id} className="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex justify-between items-start">
                                                    <div className="flex-1 pr-2">
                                                        <div className="flex gap-2 mb-1">
                                                            <span className="text-[10px] bg-stone-100 px-2 rounded border">{q.setor}</span>
                                                            {q.critical && <span className="text-[10px] bg-red-600 text-white px-2 rounded">CRÍTICO</span>}
                                                            {(q.weight > 1) && <span className="text-[10px] bg-blue-100 text-blue-800 px-2 rounded border border-blue-200">Peso {q.weight}</span>}
                                                        </div>
                                                        <p className="text-sm font-medium">{q.pergunta}</p>
                                                    </div>
                                                    <div className="flex flex-col gap-2">
                                                        <button onClick={() => { setEditingQ(q); setIsModalOpen(true); }} className="p-2 bg-stone-100 rounded text-stone-500"><Icons.Edit /></button>
                                                        <button onClick={() => handleDeleteQuestion(q.id)} className="p-2 bg-red-50 rounded text-red-500"><Icons.Trash /></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={() => { setEditingQ(null); setIsModalOpen(true); }} className="fixed bottom-6 right-6 bg-yellow-500 text-white h-14 w-14 rounded-full shadow-lg flex items-center justify-center hover:bg-yellow-600 z-20"><Icons.Plus /></button>
                                    </div>
                                )}
                                {settingsTab === 'history' && (
                                    <div className="space-y-3">
                                        {inspections.sort((a,b) => new Date(b.data) - new Date(a.data)).map(insp => {
                                            const historyScore = insp.bonusScore !== undefined ? insp.bonusScore : insp.score;
                                            return (
                                            <div key={insp.id} className="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex justify-between items-center">
                                                <div>
                                                    <div className="font-bold">{insp.setor}</div>
                                                    <div className="text-xs text-stone-500">{new Date(insp.data).toLocaleDateString()} • {insp.responsavel}</div>
                                                </div>
                                                <div className="flex gap-2 items-center">
                                                    <span className={`font-bold ${historyScore >= 85 ? 'text-green-600' : 'text-red-600'}`}>{historyScore}%</span>
                                                    <button onClick={() => handleDeleteAudit(insp.id)} className="p-2 bg-stone-100 rounded text-red-500"><Icons.Trash /></button>
                                                    <button onClick={() => { setReportInspection(insp); setView('report'); }} className="p-2 bg-stone-100 rounded text-stone-500"><Icons.FileText /></button>
                                                </div>
                                            </div>
                                        )})}
                                    </div>
                                )}
                            </main>
                        </div>
                    )}

                    {/* OUTRAS TELAS (Analytics, Relatórios) */}
                    {view === 'analytics' && (
                        <div className="max-w-md mx-auto min-h-screen bg-stone-100 flex flex-col text-stone-900">
                             <header className="bg-white p-4 flex items-center justify-between sticky top-0 shadow-md">
                                <button onClick={() => setView('dashboard')} className="text-sm font-bold text-stone-500">← Voltar</button>
                                <h1 className="font-bold text-yellow-600">Indicadores</h1><div className="w-10"></div>
                            </header>
                            <div className="flex bg-white p-2 gap-2 sticky top-[60px]"><button onClick={() => setAnalyticsTab('weekly')} className={`flex-1 py-2 text-xs font-bold rounded-lg ${analyticsTab === 'weekly' ? 'bg-yellow-500 text-white' : 'bg-stone-100 text-stone-500'}`}>Semanal</button><button onClick={() => setAnalyticsTab('monthly')} className={`flex-1 py-2 text-xs font-bold rounded-lg ${analyticsTab === 'monthly' ? 'bg-yellow-500 text-white' : 'bg-stone-100 text-stone-500'}`}>Mensal</button></div>
                            <main className="flex-1 p-6 space-y-6">
                                <button onClick={() => setView('management_report')} className="w-full py-3 bg-yellow-500 text-white font-bold rounded-lg flex justify-center items-center gap-2"><Icons.FileText /> Gerar Relatório</button>
                                <div className="bg-white rounded-xl p-6 border text-center shadow-sm">
                                    <h3 className="text-xs font-bold text-stone-500 uppercase">{analyticsTab === 'weekly' ? 'Média Semanal' : 'Média Mensal'}</h3>
                                    <div className="text-5xl font-black mt-2 text-yellow-600">{analytics.avgScore}%</div>
                                </div>
                            </main>
                        </div>
                    )}

                    {view === 'report' && reportInspection && (
                        <div className="min-h-screen bg-white text-black p-8 max-w-4xl mx-auto print-container">
                            <div className="flex justify-between items-center mb-6 no-print">
                                <button onClick={() => setView('dashboard')} className="bg-stone-200 px-4 py-2 rounded font-bold">Voltar</button>
                                <button onClick={() => handleDownloadPDF('inspection-report-content', `Relatorio_${reportInspection.setor}.pdf`)} className="bg-yellow-500 text-white px-4 py-2 rounded font-bold">Baixar PDF</button>
                            </div>
                            <div id="inspection-report-content" className="border border-gray-300 p-8 print-border">
                                <h1 className="text-2xl font-bold uppercase mb-4 border-b-2 border-black pb-2">Relatório de Inspeção</h1>
                                <div className="grid grid-cols-2 gap-4 mb-8">
                                    <div><strong>Setor:</strong> {reportInspection.setor}</div>
                                    <div><strong>Auditor:</strong> {reportInspection.responsavel}</div>
                                    <div><strong>Data:</strong> {new Date(reportInspection.data).toLocaleDateString()}</div>
                                    <div className="text-xl font-bold text-yellow-600">Nota: {reportInspection.score}%</div>
                                </div>
                                <h3 className="font-bold border-b mb-4">Não Conformidades</h3>
                                <div className="space-y-4">
                                    {Object.entries(reportInspection.respostas).filter(([_, v]) => v === 'NC').map(([qid, _]) => {
                                        const q = questions.find(qu => qu.id === qid);
                                        return (
                                            <div key={qid} className="border border-red-100 bg-red-50 p-3 rounded">
                                                <p className="font-bold text-red-700">{q?.pergunta}</p>
                                                <p className="text-sm mt-1 text-gray-800">Obs: {reportInspection.observacoes[qid]}</p>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'management_report' && (
                        <div className="min-h-screen bg-white text-black p-8 max-w-4xl mx-auto print-container">
                            <div className="flex justify-between mb-6 no-print">
                                <button onClick={() => setView('analytics')} className="bg-stone-200 px-4 py-2 rounded font-bold">Voltar</button>
                                <button onClick={handleExportManagementExcel} className="bg-green-600 text-white px-4 py-2 rounded font-bold flex items-center gap-2"><Icons.Excel /> Excel</button>
                            </div>
                            <div id="management-report-content" className="p-8 border shadow-sm">
                                <h1 className="text-3xl font-bold uppercase tracking-tight">Relatório Gerencial</h1>
                                <div className="mt-8 text-3xl font-black">{analytics.avgScore}% <span className="text-sm font-normal text-gray-500 block uppercase">Média Geral</span></div>
                                <h2 className="text-lg font-bold border-b mt-8 mb-4 uppercase">Ranking</h2>
                                {analytics.ranking.map((r, i) => <div key={i} className="flex justify-between border-b py-2 font-bold"><span className="text-gray-500">{i+1}º</span> <span>{r.setor}</span> <span className="text-yellow-600">{r.score}%</span></div>)}
                            </div>
                        </div>
                    )}

                    {/* MODAIS */}
                    {isSigning && <SignaturePad onSave={handleSaveSignature} onCancel={() => setIsSigning(false)} initialData={signature} />}
                    
                    {/* Modal Criar/Editar Pergunta Normal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6">
                                <h2 className="text-lg font-bold mb-4 text-yellow-600">{editingQ ? 'Editar' : 'Nova'} Pergunta</h2>
                                <form onSubmit={handleSaveQuestion} className="space-y-4">
                                    <div><label className="block text-xs font-bold text-stone-500 uppercase mb-1">Setor</label><input name="setor" defaultValue={editingQ?.setor || ''} list="setores-list" className="w-full p-3 bg-stone-50 border rounded-lg outline-none" required /><datalist id="setores-list">{allSetors.map(s => <option key={s} value={s} />)}</datalist></div>
                                    <div><label className="block text-xs font-bold text-stone-500 uppercase mb-1">Grupo</label><input name="grupo" defaultValue={editingQ?.grupo || ''} className="w-full p-3 bg-stone-50 border rounded-lg outline-none" required /></div>
                                    <div><label className="block text-xs font-bold text-stone-500 uppercase mb-1">Pergunta</label><textarea name="pergunta" defaultValue={editingQ?.pergunta || ''} className="w-full p-3 bg-stone-50 border rounded-lg h-24 resize-none outline-none" required /></div>
                                    <div className="flex gap-4"><div className="flex-1"><label className="block text-xs font-bold text-stone-500 uppercase mb-1">Peso</label><input type="number" name="weight" defaultValue={editingQ?.weight || 1} min="1" className="w-full p-3 bg-stone-50 border rounded-lg outline-none" /></div></div>
                                    <div className="flex gap-2 pt-2"><button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 py-3 border rounded-lg font-bold">Cancelar</button><button type="submit" className="flex-1 py-3 bg-yellow-500 text-white rounded-lg font-bold">Salvar na Nuvem</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL DIDÁTICO: CLONAR SETOR */}
                    {isCloneModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 animate-fade-in">
                                <div className="flex items-center gap-2 text-yellow-600 mb-4">
                                    <Icons.Copy />
                                    <h2 className="text-lg font-bold">Clonar Setor</h2>
                                </div>
                                <p className="text-xs text-stone-500 mb-6">Crie um novo setor inteiro copiando todas as perguntas de um setor que já existe. Isso economiza tempo e é mais prático!</p>
                                
                                <form onSubmit={handleCloneSector} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-stone-500 uppercase mb-1">1. Copiar do Setor (Origem)</label>
                                        <select value={cloneSourceSector} onChange={e => setCloneSourceSector(e.target.value)} required className="w-full p-3 bg-stone-50 border rounded-lg outline-none focus:border-yellow-500">
                                            <option value="">Selecione um setor...</option>
                                            {allSetors.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-stone-500 uppercase mb-1">2. Nome do Novo Setor (Destino)</label>
                                        <input type="text" value={cloneTargetSector} onChange={e => setCloneTargetSector(e.target.value)} required placeholder="Ex: ESTOQUE FILIAL 2" className="w-full p-3 bg-stone-50 border rounded-lg outline-none focus:border-yellow-500 uppercase" />
                                    </div>
                                    
                                    <div className="flex gap-2 pt-4">
                                        <button type="button" onClick={() => setIsCloneModalOpen(false)} className="flex-1 py-3 border rounded-lg font-bold text-stone-600 hover:bg-stone-50">Cancelar</button>
                                        <button type="submit" className="flex-1 py-3 bg-stone-900 text-white rounded-lg font-bold hover:bg-stone-800 shadow-md">Clonar Setor</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ToastProvider>
                <AppContent />
            </ToastProvider>
        );
    </script>
</body>
</html>
