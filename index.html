                Desenvolvido por Jan Gabriel
            </div>
        );

        const getLocalDateString = (dateObj) => {
            if (!dateObj) return new Date().toISOString().slice(0, 10);
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const createSafeDate = (dateStr) => {
            if (!dateStr) return new Date();
            if (dateStr.length === 10) return new Date(dateStr + 'T12:00:00');
            return new Date(dateStr);
        };
        
        const formatDateDisplay = (dateStr) => {
            if (!dateStr) return "-";
            const date = createSafeDate(dateStr);
            return date.toLocaleDateString('pt-BR');
        };

        const getWeekID = (dateStr, offset = 0) => {
            try {
                let now;
                if (!dateStr) { now = new Date(); } 
                else {
                    if (dateStr.length === 10) { now = new Date(dateStr + 'T12:00:00'); } 
                    else { now = new Date(dateStr); }
                }
                now.setDate(now.getDate() + (offset * 7));
                const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
                const dayNum = d.getUTCDay() || 7;
                d.setUTCDate(d.getUTCDate() + 4 - dayNum);
                const year = d.getUTCFullYear();
                const weekNo = Math.ceil(( ( (d - new Date(Date.UTC(year,0,1))) / 86400000) + 1)/7);
                return `${year}-W${weekNo}`;
            } catch (e) { return "INVALID-DATE"; }
        };

        const getWeekRangeFromDate = (dateStr) => {
             const curr = createSafeDate(dateStr);
             const day = curr.getDay(); 
             const diff = curr.getDate() - day + (day === 0 ? -6 : 1); 
             const first = new Date(curr);
             first.setDate(diff);
             const last = new Date(curr);
             last.setDate(diff + 6);
             return `${first.toLocaleDateString('pt-BR')} até ${last.toLocaleDateString('pt-BR')}`;
        }

        const ToastContext = React.createContext();
        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const addToast = (msg, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, msg, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };
            return (
                <ToastContext.Provider value={addToast}>
                    {children}
                    <div className="fixed top-4 right-4 z-50 space-y-2">
                        {toasts.map(t => (
                            <div key={t.id} className={`toast-enter p-4 rounded-lg shadow-xl text-white font-bold flex items-center gap-2 ${t.type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>
                                {t.type === 'success' ? <Icons.Check /> : <Icons.Alert />}
                                {t.msg}
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };
        const useToast = () => React.useContext(ToastContext);

        const Lightbox = ({ src, onClose }) => {
            if (!src) return null;
            return (
                <div className="fixed inset-0 z-[60] bg-black bg-opacity-90 flex items-center justify-center p-4" onClick={onClose}>
                    <img src={src} className="max-w-full max-h-full rounded shadow-2xl" />
                    <button className="absolute top-4 right-4 text-white p-2 bg-white/20 rounded-full hover:bg-white/40"><Icons.Trash /></button>
                </div>
            );
        };

        const getStarCount = (s) => {
            if (s >= 96) return 5;
            if (s >= 85) return 4;
            if (s >= 70) return 3;
            if (s >= 50) return 2;
            return 1;
        };

        const StarRating = ({ score }) => {
            const count = getStarCount(score);
            return (
                <div className="flex gap-0.5 text-yellow-500" title={`${count} Estrelas`}>
                    {[...Array(5)].map((_, i) => (
                        <Icons.Star key={i} filled={i < count} />
                    ))}
                </div>
            );
        };

                if(!canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#000"; 
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                
                if (initialData) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = initialData;
                }
            }, []);

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                ctx.beginPath();
                ctx.moveTo(x, y);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = () => { setIsDrawing(false); };
            const handleClear = () => { const canvas = canvasRef.current; const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); };
            const handleConfirm = () => { onSave(canvasRef.current.toDataURL()); };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                    <div className="bg-stone-100 border border-stone-300 rounded-xl shadow-2xl w-full max-w-md p-6 animate-in fade-in zoom-in duration-200">
                        <h3 className="text-lg font-bold text-stone-800 mb-4 flex items-center gap-2"><Icons.Pen /> Assinatura do Responsável</h3>
                        <div className="bg-white rounded-lg mb-4 h-48 border border-stone-400 relative overflow-hidden">
                             <canvas ref={canvasRef} className="w-full h-full touch-none" onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} />
                            <div className="absolute bottom-2 right-2 text-xs text-gray-400 pointer-events-none">Assine acima</div>
                        </div>
                        <div className="flex gap-2">
                             <button onClick={onCancel} className="flex-1 py-3 border border-stone-300 rounded-lg text-stone-600 font-bold hover:bg-stone-200 transition-colors">Cancelar</button>
                             <button onClick={handleClear} className="px-4 py-3 border border-stone-300 rounded-lg text-stone-600 font-bold hover:text-red-500 hover:bg-stone-200 transition-colors" title="Limpar"><Icons.Trash /></button>
                             <button onClick={handleConfirm} className="flex-1 py-3 bg-yellow-500 text-stone-900 rounded-lg font-bold hover:bg-yellow-400 shadow-lg shadow-yellow-500/20 transition-colors">Confirmar</button>
                        </div>
                    </div>
                </div>
            );
        };

        const LoginScreen = ({ setUser }) => {
            const toast = useToast();
            const [loading, setLoading] = useState(false);

            const handleGoogleLogin = async () => {
                setLoading(true);
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                    toast("Login efetuado com sucesso!", "success");
                } catch (error) {
                    console.error(error);
                    toast(error.message, "error");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-screen bg-stone-100 max-w-md mx-auto shadow-2xl relative items-center justify-center p-6 text-stone-900 animate-fade-in">
                    <div className="w-full bg-white p-8 rounded-2xl shadow-lg border border-stone-200">
                        <div className="text-center mb-8">
                            <div className="h-16 w-16 bg-yellow-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-md text-white">
                                <Icons.Check />
                            </div>
                            <h1 className="text-2xl font-black text-stone-800">Checklist Qualidade</h1>
                            <p className="text-sm text-stone-500 font-medium">Acesse o sistema IMAC</p>
                        </div>

                        <button 
                            onClick={handleGoogleLogin} 
                            disabled={loading} 
                            className="w-full py-4 mt-4 bg-white border border-stone-300 text-stone-700 font-bold rounded-lg shadow-sm hover:bg-stone-50 transition-all active:scale-95 flex items-center justify-center gap-3 disabled:opacity-50"
                        >
                            <Icons.Google />
                            {loading ? 'Aguarde...' : 'Entrar com Google'}
                        </button>
                    </div>
                </div>
            );
        };

        function AppContent() {
            const toast = useToast();
            const [user, setUser] = useState(null);
            const [authLoaded, setAuthLoaded] = useState(false);

            const [view, setView] = useState('loading');
            const [selectedSetor, setSelectedSetor] = useState('');
            const [responsavel, setResponsavel] = useState('');
            const [questions, setQuestions] = useState([]);
            const [inspections, setInspections] = useState([]);
            const [logo, setLogo] = useState(null);
            const [lastBackup, setLastBackup] = useState(null);
            const [weekOffset, setWeekOffset] = useState(0); 
            const [lightboxImg, setLightboxImg] = useState(null);
            
            const today = new Date();
            const localISODate = new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            const [inspectionDate, setInspectionDate] = useState(localISODate);
            const [analyticsSelectedDate, setAnalyticsSelectedDate] = useState(localISODate);

            const [inspectionSearch, setInspectionSearch] = useState('');
            const [answers, setAnswers] = useState({});
            const [ncQtys, setNcQtys] = useState({}); 
            const [obs, setObs] = useState({});
            const [evidences, setEvidences] = useState({}); 
            const [signature, setSignature] = useState(null);
            const [isSigning, setIsSigning] = useState(false);
            const [editingInspectionId, setEditingInspectionId] = useState(null);
            const [previousNCs, setPreviousNCs] = useState({});

            const [reportInspection, setReportInspection] = useState(null);
            const [actionPlan, setActionPlan] = useState('');

            const [settingsTab, setSettingsTab] = useState('questions');
            const [analyticsTab, setAnalyticsTab] = useState('weekly'); 
            const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
            const [editingQ, setEditingQ] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            
            const [searchTerm, setSearchTerm] = useState('');
            const [filterSector, setFilterSector] = useState(''); // NOVO ESTADO: Filtro por Setor

            const [isCloneModalOpen, setIsCloneModalOpen] = useState(false);
            const [cloneSourceSector, setCloneSourceSector] = useState('');
            const [cloneTargetSector, setCloneTargetSector] = useState('');

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(usr => {
                    setUser(usr);
                    setAuthLoaded(true);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!authLoaded) return;
                if (!user) { setView('login'); return; }

                let unsubQuestions;
                let unsubInspections;

                const loadData = async () => {
                    try {
                        setView('loading');
                        
                        unsubQuestions = db.collection('questions').onSnapshot(snap => {
                            const qList = snap.docs.map(doc => doc.data());
                            if (qList.length === 0 && !window.hasSeededQuestions) {
                                window.hasSeededQuestions = true;
                                STATIC_DB_PERGUNTAS.forEach(p => DB.saveQuestion(p));
                            } else {
                                setQuestions(qList);
                            }
                        });

                        unsubInspections = db.collection('inspections').onSnapshot(snap => {
                            const iList = snap.docs.map(doc => doc.data());
                            setInspections(iList);
                        });

                        const l = await DB.getConfig('logo');
                        const b = await DB.getConfig('lastBackup');
                        const wo = await DB.getConfig('weekOffset');

                        setLogo(l);
                        setLastBackup(b);
                        setWeekOffset(wo || 0);

                        const draftStr = localStorage.getItem('imac_current_draft');
                        if (draftStr) {
                            const draft = JSON.parse(draftStr);
                            if (draft && draft.selectedSetor) {
                                setSelectedSetor(draft.selectedSetor);
                                setResponsavel(draft.responsavel);
                                setInspectionDate(draft.inspectionDate);
                                setAnswers(draft.answers || {});
                                setNcQtys(draft.ncQtys || {});
                                setObs(draft.obs || {});
                                setEvidences(draft.evidences || {});
                                setSignature(draft.signature);
                                setEditingInspectionId(draft.editingInspectionId);
                                setPreviousNCs(draft.previousNCs || {});
                                setView('inspection');
                                toast("Inspeção restaurada automaticamente.", 'success');
                                return;
                            }
                        }
                        
                        setView('dashboard');

                    } catch (e) {
                        console.error("Erro ao carregar DB Firestore", e);
                        toast("Erro ao carregar banco de dados na nuvem.", 'error');
                        setView('dashboard');
                    }
                };
                
                loadData();
                return () => { if (unsubQuestions) unsubQuestions(); if (unsubInspections) unsubInspections(); };
            }, [user, authLoaded]);

            useEffect(() => {
                if (view !== 'inspection' || !selectedSetor) return;
                const timer = setTimeout(() => {
                    const draft = { selectedSetor, responsavel, inspectionDate, answers, ncQtys, obs, evidences, signature, editingInspectionId, previousNCs };
                    localStorage.setItem('imac_current_draft', JSON.stringify(draft));
                }, 1000); 
                return () => clearTimeout(timer);
            }, [view, selectedSetor, responsavel, inspectionDate, answers, ncQtys, obs, evidences, signature, editingInspectionId, previousNCs]);

            const currentWeekId = getWeekID(localISODate, weekOffset);
            const weekId = getWeekID(inspectionDate); 
            
            const allSetors = useMemo(() => {
                const s = new Set(questions.map(p => p.setor).filter(x => x !== 'TODOS'));
                return Array.from(s).sort();
            }, [questions]);

            const inspectionsThisWeek = useMemo(() => {
                return inspections.filter(i => i.weekId === currentWeekId);
            }, [inspections, currentWeekId]);

            const setoresConcluidos = useMemo(() => new Set(inspectionsThisWeek.map(i => i.setor)), [inspectionsThisWeek]);

            const progress = useMemo(() => {
                const total = allSetors.length;
                const done = setoresConcluidos.size;
                const pct = total === 0 ? 0 : Math.round((done / total) * 100);
                return { total, done, pct };
            }, [allSetors, setoresConcluidos]);

            const currentQuestions = useMemo(() => {
                if (!selectedSetor) return [];
                return questions.filter(p => p.setor === selectedSetor || p.setor === 'TODOS');
            }, [selectedSetor, questions]);

            const scores = useMemo(() => {
                if (currentQuestions.length === 0) return { real: 0, bonus: 0 };
                let totalReal = 0, conformesReal = 0, totalBonus = 0, conformesBonus = 0;

                currentQuestions.forEach(q => {
                    const resp = answers[q.id];
                    if (resp && resp !== 'NA') {
                        const weight = q.weight || 1;
                        if (resp === 'C') {
                            totalReal += weight;
                            conformesReal += weight;
                            if (q.grupo !== 'ESTRUTURAL') { totalBonus += weight; conformesBonus += weight; }
                        } else if (resp === 'NC') {
                            const qty = ncQtys[q.id] || 1;
                            totalReal += (weight * qty);
                            if (q.grupo !== 'ESTRUTURAL') totalBonus += (weight * qty);
                        }
                    }
                });

                return {
                    real: totalReal === 0 ? 0 : Math.round((conformesReal / totalReal) * 100),
                    bonus: totalBonus === 0 ? 0 : Math.round((conformesBonus / totalBonus) * 100)
                };
            }, [answers, ncQtys, currentQuestions]);

            const handleLogout = async () => { await auth.signOut(); toast("Você saiu do sistema."); }

            const handleStartInspection = (setor) => {
                if (!responsavel) { toast("Informe o responsável para iniciar.", 'error'); return; }
                setSelectedSetor(setor);
                setAnswers({}); setNcQtys({}); setObs({}); setEvidences({});
                setSignature(null); setEditingInspectionId(null); setInspectionSearch('');
                const now = new Date();
                now.setDate(now.getDate() + (weekOffset * 7));
                setInspectionDate(getLocalDateString(now));
                
                const sortedInspections = inspections.filter(i => i.setor === setor).sort((a, b) => new Date(b.data) - new Date(a.data));
                const lastInsp = sortedInspections[0];
                const prevNCsMap = {};
                if (lastInsp) {
                    Object.entries(lastInsp.respostas).forEach(([qId, val]) => {
                        if(val === 'NC') { prevNCsMap[qId] = lastInsp.observacoes[qId] || "Sem observação"; }
                    });
                }
                setPreviousNCs(prevNCsMap);
                setView('inspection');
            };

            const handleDeleteAudit = async (id) => {
                if (!confirm("Tem certeza que deseja apagar este registro do sistema (Nuvem)?")) return;
                await DB.deleteInspection(id);
                toast("Inspeção apagada com sucesso.");
            };

            const handlePhotoUpload = (qId, e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressedBase64 = canvas.toDataURL("image/jpeg", 0.6); 
                        setEvidences(prev => {
                            const currentList = prev[qId] ? (Array.isArray(prev[qId]) ? prev[qId] : [prev[qId]]) : [];
                            return { ...prev, [qId]: [...currentList, compressedBase64] };
                        });
                        toast("Foto adicionada!", 'success');
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            };

            const removePhoto = (qId, index) => {
                setEvidences(prev => {
                    const currentList = prev[qId] ? (Array.isArray(prev[qId]) ? prev[qId] : [prev[qId]]) : [];
                    const newList = currentList.filter((_, i) => i !== index);
                    return { ...prev, [qId]: newList };
                });
            };

            const handleSaveSignature = (sigData) => { setSignature(sigData); setIsSigning(false); };

            const handleSaveInspection = async () => {
                try {
                    const pendentes = currentQuestions.filter(q => !answers[q.id]);
                    if (pendentes.length > 0 && !confirm(`Existem ${pendentes.length} perguntas sem resposta. Salvar mesmo assim?`)) return;
                    if (!signature && !confirm("Salvar sem assinatura?")) return;

                    toast("Sincronizando com a nuvem...", "success");
                    const targetWeekId = getWeekID(inspectionDate, 0); 
                    const dataIsoSalva = inspectionDate + 'T12:00:00.000Z';

                    const newInspection = {
                        id: editingInspectionId || Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        setor: selectedSetor, responsavel: responsavel, data: dataIsoSalva, weekId: targetWeekId,
                        score: scores.real, bonusScore: scores.bonus, respostas: answers, ncQtys: ncQtys,
                        observacoes: obs, evidencias: evidences, assinatura: signature, status: 'Concluído'
                    };

                    await DB.saveInspection(newInspection);
                    localStorage.removeItem('imac_current_draft'); 
                    
                    const ncs = Object.entries(newInspection.respostas).filter(([_, v]) => v === 'NC');
                    let sugestao = "Parabéns! Nenhuma não conformidade detectada.";
                    
                    if (ncs.length > 0) {
                        sugestao = ncs.map(([qid]) => {
                            const q = questions.find(qu => qu.id === qid);
                            return `- Resolver NC em ${q?.grupo || 'Geral'}: ${q?.pergunta || 'Item'} (Obs: ${newInspection.observacoes[qid] || ' '})`;
                        }).join('\n');
                    }
                    setActionPlan(sugestao);
                    setReportInspection(newInspection);
                    setView('report');
                    toast("Inspeção salva com sucesso no Firebase!");
                } catch (e) { console.error(e); toast("Erro ao salvar na nuvem.", 'error'); }
            };

            const handleCancelInspection = () => {
                 if (confirm("Deseja cancelar esta inspeção? Todos os dados não salvos serão perdidos.")) {
                     localStorage.removeItem('imac_current_draft'); 
                     setView('dashboard');
                 }
            };

            const handleSaveQuestion = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const weight = parseInt(formData.get('weight')) || 1;
                const newQ = {
                    id: editingQ?.id || Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    setor: formData.get('setor').toUpperCase(),
                    grupo: formData.get('grupo').toUpperCase(),
                    pergunta: formData.get('pergunta'),
                    critical: formData.get('critical') === 'on',
                    weight: weight
                };
                
                await DB.saveQuestion(newQ);
                setIsModalOpen(false); setEditingQ(null);
                toast("Pergunta salva na Nuvem.");
            };

            const handleCloneSector = async (e) => {
                e.preventDefault();
                if (!cloneSourceSector || !cloneTargetSector) { toast("Preencha os campos obrigatórios.", "error"); return; }
                const newSectorName = cloneTargetSector.toUpperCase();
                const sourceQuestions = questions.filter(q => q.setor === cloneSourceSector);

                if (sourceQuestions.length === 0) { toast("O setor espelho não possui perguntas.", "error"); return; }
                if (allSetors.includes(newSectorName)) { if (!confirm(`O setor ${newSectorName} já existe. Deseja adicionar as perguntas a ele mesmo assim?`)) return; }

                toast("Clonando setor espelho, aguarde...");
                try {
                    for (let q of sourceQuestions) {
                        const newQ = { ...q, id: Date.now().toString() + Math.random().toString(36).substr(2, 6), setor: newSectorName };
                        await DB.saveQuestion(newQ);
                    }
                    setIsCloneModalOpen(false); setCloneSourceSector(''); setCloneTargetSector('');
                    toast(`Novo setor ${newSectorName} criado a partir do espelho!`, "success");
                } catch (err) { console.error(err); toast("Erro ao clonar perguntas.", "error"); }
            };

            const handleDeleteQuestion = async (id) => {
                if(confirm("Tem certeza que deseja apagar essa pergunta definitivamente?")) {
                    await DB.deleteQuestion(id); toast("Pergunta apagada.");
                }
            };

            const handleNextWeek = async () => {
                if (confirm("Deseja iniciar a próxima semana de auditorias?\n\nA data base do sistema avançará 1 semana.")) {
                    const newOffset = weekOffset + 1;
                    await DB.setConfig('weekOffset', newOffset);
                    setWeekOffset(newOffset);
                    toast("Nova semana iniciada!", 'success');
                }
            };

            const handleRestoreBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        toast("Sincronizando dados com a nuvem... Isso pode levar alguns segundos.", "success");
                        const data = JSON.parse(event.target.result);
                        if (data.questions && Array.isArray(data.questions)) { for (const q of data.questions) { await DB.saveQuestion(q); } }
                        if (data.inspections && Array.isArray(data.inspections)) { for (const insp of data.inspections) { await DB.saveInspection(insp); } }
                        if (data.logo) { await DB.setConfig('logo', data.logo); setLogo(data.logo); }
                        if (data.weekOffset !== undefined) { await DB.setConfig('weekOffset', data.weekOffset); setWeekOffset(data.weekOffset); }
                        toast("Backup antigo migrado para a Nuvem com sucesso!", "success");
                    } catch (err) { console.error(err); toast("Erro ao restaurar backup. Arquivo inválido.", 'error'); }
                };
                reader.readAsText(file); e.target.value = null; 
            };

            const handleExportCSV = () => {
                const headers = ["ID", "Data", "Semana", "Setor", "Responsavel", "Nota", "Questão", "Grupo", "Peso", "Resposta", "Qtd Penalidades", "Observação"];
                const rows = [];
                inspections.forEach(insp => {
                    Object.entries(insp.respostas).forEach(([qId, resp]) => {
                        const q = questions.find(qu => qu.id === qId);
                        const qty = (insp.ncQtys && insp.ncQtys[qId]) || 1;
                        rows.push([
                            insp.id, new Date(insp.data).toLocaleDateString(), insp.weekId, insp.setor, insp.responsavel, insp.score,
                            q ? q.pergunta.replace(/;/g, ',') : 'Questão removida', q ? q.grupo : '-', q ? (q.weight || 1) : 1,
                            resp, resp === 'NC' ? qty : '-', (insp.observacoes[qId] || '').replace(/;/g, ',')
                        ]);
                    });
                });
                const csvContent = "data:text/csv;charset=utf-8," + headers.join(";") + "\n" + rows.map(e => e.join(";")).join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri); link.setAttribute("download", "imac_dados_brutos.csv");
                document.body.appendChild(link); link.click();
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = async () => { await DB.setConfig('logo', reader.result); setLogo(reader.result); toast("Logo salva na nuvem."); };
                reader.readAsDataURL(file);
            };

            const handleDownloadPDF = (elementId, filename, isLandscape = false) => {
                const element = document.getElementById(elementId);
                const opt = {
                    margin: 5, filename: filename, image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: isLandscape ? 'landscape' : 'portrait' }
                };
                if (window.html2pdf) { window.html2pdf().set(opt).from(element).save(); } 
                else { toast("Biblioteca PDF não carregada.", 'error'); }
            };

            const filteredInspectionQuestions = useMemo(() => {
                if (!inspectionSearch) return currentQuestions;
                const lower = inspectionSearch.toLowerCase();
                return currentQuestions.filter(q => q.pergunta.toLowerCase().includes(lower) || q.grupo.toLowerCase().includes(lower));
            }, [currentQuestions, inspectionSearch]);

            // --- ANALYTICS ENHANCEMENT FOR TABLET & LEADERS ---
            const analytics = useMemo(() => {
                let filteredInspections = [];
                if (analyticsTab === 'weekly') {
                    const targetWeekId = getWeekID(analyticsSelectedDate);
                    filteredInspections = inspections.filter(i => i.weekId === targetWeekId);
                } else {
                    filteredInspections = inspections.filter(i => i.data.startsWith(selectedMonth));
                }

                const totalScore = filteredInspections.reduce((acc, curr) => acc + (curr.score || 0), 0);
                const avgScore = filteredInspections.length ? Math.round(totalScore / filteredInspections.length) : 0;
                
                const totalBonusScore = filteredInspections.reduce((acc, curr) => acc + (curr.bonusScore !== undefined ? curr.bonusScore : curr.score || 0), 0);
                const avgBonusScore = filteredInspections.length ? Math.round(totalBonusScore / filteredInspections.length) : 0;

                const grouped = {};
                const sectorAnalysisData = {}; // Novo mapeamento detalhado por setor e grupo

                allSetors.forEach(s => {
                    sectorAnalysisData[s] = {
                        score: 0, bonusScore: 0, count: 0,
                        ncByCategory: {}, totalNC: 0, ncs: []
                    };
                });

                const ncBySector = {};
                const ncByCategory = {};
                const auditorScores = {}; 

                filteredInspections.forEach(insp => {
                    if(!grouped[insp.setor]) grouped[insp.setor] = { total: 0, count: 0 };
                    grouped[insp.setor].total += (insp.bonusScore !== undefined ? insp.bonusScore : insp.score || 0);
                    grouped[insp.setor].count += 1;

                    if (!auditorScores[insp.responsavel]) auditorScores[insp.responsavel] = { total: 0, count: 0 };
                    auditorScores[insp.responsavel].total += (insp.bonusScore !== undefined ? insp.bonusScore : insp.score || 0);
                    auditorScores[insp.responsavel].count += 1;

                    if(sectorAnalysisData[insp.setor]) {
                        sectorAnalysisData[insp.setor].count += 1;
                        sectorAnalysisData[insp.setor].score += (insp.score || 0);
                        sectorAnalysisData[insp.setor].bonusScore += (insp.bonusScore !== undefined ? insp.bonusScore : insp.score || 0);
                    }

                    if(insp.respostas) {
                        Object.entries(insp.respostas).forEach(([qId, resp]) => {
                            if (resp === 'NC') {
                                const qty = (insp.ncQtys && insp.ncQtys[qId]) || 1;
                                const question = questions.find(q => q.id === qId);
                                const grupo = question ? question.grupo : 'GERAL';
                                
                                ncBySector[insp.setor] = (ncBySector[insp.setor] || 0) + qty;
                                ncByCategory[grupo] = (ncByCategory[grupo] || 0) + qty;

                                if(sectorAnalysisData[insp.setor]) {
                                    sectorAnalysisData[insp.setor].totalNC += qty;
                                    sectorAnalysisData[insp.setor].ncByCategory[grupo] = (sectorAnalysis[insp.setor].ncByCategory[grupo] || 0) + qty;
                                    sectorAnalysisData[insp.setor].ncs.push({
                                        pergunta: question ? question.pergunta : 'Item removido',
                                        obs: insp.observacoes[qId],
                                        qty: qty,
                                        grupo: grupo
                                    });
                                }
                            }
                        });
                    }
                });

                Object.keys(sectorAnalysisData).forEach(s => {
                    if(sectorAnalysisData[s].count > 0) {
                        sectorAnalysisData[s].avgScore = Math.round(sectorAnalysisData[s].bonusScore / sectorAnalysisData[s].count);
                    } else {
                        sectorAnalysisData[s].avgScore = 0;
                    }
                });

                let ranking = Object.entries(grouped).map(([setor, val]) => ({
                    setor, score: Math.round(val.total / val.count), count: val.count
                })).sort((a, b) => b.score - a.score);

                const colors = ['#eab308', '#a8a29e', '#f59e0b', '#78716c', '#ef4444', '#84cc16', '#3b82f6', '#d946ef'];
                const pieSector = Object.entries(ncBySector).map(([label, value], i) => ({ label, value, color: colors[i % colors.length] })).sort((a, b) => b.value - a.value); 
                const pieCategory = Object.entries(ncByCategory).map(([label, value], i) => ({ label, value, color: colors[i % colors.length] })).sort((a, b) => b.value - a.value); 
                const auditorPerformance = Object.entries(auditorScores).map(([name, val]) => ({ name, avg: Math.round(val.total / val.count), count: val.count })).sort((a, b) => b.avg - a.avg);

                const totalInspections = filteredInspections.length;
                const bestSector = ranking.length > 0 ? ranking[0].setor : "Nenhum";
                const worstSector = ranking.length > 0 ? ranking[ranking.length - 1].setor : "Nenhum";
                const mainIssue = pieCategory.length > 0 ? pieCategory[0].label : "Nenhum";
                const summaryText = `Neste período (${analyticsTab === 'weekly' ? 'Semana' : 'Mês'}), foram realizadas ${totalInspections} inspeções, resultando em uma média global de ${avgScore}%. O setor com melhor desempenho foi "${bestSector}", enquanto "${worstSector}" apresentou os menores índices. A principal categoria de não conformidades foi "${mainIssue}".`;

                return { avgScore, avgBonusScore, ranking, pieSector, pieCategory, auditorPerformance, summaryText, filteredInspections, sectorAnalysisData };
            }, [inspections, questions, weekId, analyticsTab, selectedMonth, analyticsSelectedDate, allSetors]);

            const handleExportManagementExcel = () => {
                if (!window.XLSX) { toast("Biblioteca XLSX não carregada.", "error"); return; }
                const wb = XLSX.utils.book_new();
                const periodoName = analyticsTab === 'weekly' ? 'Semanal' : 'Mensal';
                
                const wsResumoData = [ ["Relatório Gerencial - Gestão de Qualidade IMAC"], ["Data de Emissão", new Date().toLocaleDateString()], ["Período Analisado", analyticsTab === 'weekly' ? getWeekRangeFromDate(analyticsSelectedDate) : selectedMonth], [], ["MÉTRICAS GERAIS"], ["Média Geral", `${analytics.avgScore}%`], ["Média Gratificação", `${analytics.avgBonusScore}%`], ["Total de Inspeções", analytics.ranking.length], ["Maior Incidência (NC)", analytics.pieCategory.length > 0 ? analytics.pieCategory[0].label : "N/A"], [], ["RESUMO EXECUTIVO"], [analytics.summaryText] ];
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsResumoData), "Resumo");

                const wsRankingData = [["Posição", "Setor", "Nota Média (Gratificação)"]];
                analytics.ranking.forEach((r, idx) => { wsRankingData.push([idx + 1, r.setor, `${r.score}%`]); });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsRankingData), "Ranking Geral");

                const wsDetalheSetor = [["Setor", "Nota", "Total NCs", "Grupo (Tipo de NC)", "Pergunta", "Observação", "Quantidade Penalidades"]];
                Object.entries(analytics.sectorAnalysisData).forEach(([setor, data]) => {
                    if (data.count > 0 && data.ncs.length > 0) {
                        data.ncs.forEach(nc => {
                            wsDetalheSetor.push([setor, `${data.avgScore}%`, data.totalNC, nc.grupo, nc.pergunta, nc.obs || "-", nc.qty]);
                        });
                    } else if (data.count > 0) {
                        wsDetalheSetor.push([setor, `${data.avgScore}%`, 0, "N/A", "Nenhuma NC registrada.", "-", "-"]);
                    }
                });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsDetalheSetor), "Detalhamento por Setor");

                XLSX.writeFile(wb, `Relatorio_Gerencial_${periodoName}_IMAC.xlsx`);
                toast("Relatório Excel exportado!", "success");
            };

            if (!authLoaded || view === 'loading') return <div className="flex h-screen bg-stone-100 items-center justify-center flex-col gap-4"><div className="animate-spin rounded-full h-12 w-12 border-b-4 border-yellow-500"></div><p className="text-stone-500 font-bold animate-pulse">Carregando Sistema da Nuvem...</p></div>;
            if (view === 'login') return <LoginScreen setUser={setUser} />;

            return (
                <div className={view === 'management_report' || view === 'report' ? "min-h-screen bg-white" : "max-w-5xl w-full mx-auto min-h-screen bg-stone-100 flex flex-col text-stone-900 shadow-2xl relative md:border-x border-stone-200"}>
                    
                    {view !== 'management_report' && view !== 'report' && <Lightbox src={lightboxImg} onClose={() => setLightboxImg(null)} />}

                    {/* DASHBOARD */}
                    {view === 'dashboard' && (
                        <>
                            <header className="bg-gradient-to-b from-yellow-500 to-yellow-600 text-stone-900 p-6 md:p-8 rounded-b-3xl md:rounded-b-none md:rounded-bl-3xl shadow-lg mb-6 relative border-b border-yellow-600/30">
                                <div className="absolute top-6 right-6 flex gap-2">
                                    <button onClick={() => { setSettingsTab('history'); setView('settings'); }} className="p-2 bg-white/30 rounded-full hover:bg-white/50 transition-colors" title="Histórico"><Icons.History /></button>
                                    <button onClick={() => setView('analytics')} className="p-2 bg-white/30 rounded-full hover:bg-white/50 transition-colors" title="Indicadores"><Icons.Chart /></button>
                                    <button onClick={() => setView('settings')} className="p-2 bg-white/30 rounded-full hover:bg-white/50 transition-colors" title="Configurações"><Icons.Gear /></button>
                                    <button onClick={handleLogout} className="p-2 bg-red-500/20 text-red-900 rounded-full hover:bg-red-500/40 transition-colors" title="Sair"><Icons.Logout /></button>
                                </div>
                                <div className="mb-4 flex flex-col md:flex-row md:items-center gap-4">
                                    {logo ? <img src={logo} alt="Logo" className="h-16 object-contain drop-shadow-md" /> : <h1 className="text-3xl font-bold text-stone-900">Checklist</h1>}
                                    <p className="text-stone-800 text-sm md:text-base font-medium">Controle de Qualidade</p>
                                </div>
                                <div className="bg-white/90 backdrop-blur-md p-4 md:p-6 rounded-xl border border-yellow-200 shadow-sm max-w-xl">
                                    <div className="flex justify-between items-end mb-2"><span className="text-stone-600 text-sm md:text-base font-bold">Progresso Semanal</span><span className="text-2xl font-bold text-yellow-600">{progress.pct}%</span></div>
                                    <div className="w-full bg-stone-200 rounded-full h-3 mb-2"><div className="bg-yellow-500 h-3 rounded-full transition-all duration-1000" style={{ width: `${progress.pct}%` }}></div></div>
                                    <p className="text-xs md:text-sm text-stone-500 text-right font-medium">{progress.done}/{progress.total} setores verificados</p>
                                </div>
                            </header>
                            <main className="flex-1 px-6 md:px-8 pb-20 animate-fade-in">
                                <div className="mb-6 max-w-xl">
                                    <label className="block text-sm font-bold text-stone-700 mb-2">Auditor Responsável</label>
                                    <input type="text" value={responsavel} onChange={(e) => setResponsavel(e.target.value)} placeholder="Digite seu nome..." className="w-full p-4 rounded-xl bg-white border border-stone-300 text-stone-900 shadow-sm outline-none focus:ring-2 focus:ring-yellow-500 transition-all text-lg" />
                                </div>
                                
                                {progress.pct === 100 && (
                                    <div className="mb-8 p-6 bg-green-50 rounded-xl border border-green-200 text-center animate-fade-in shadow-sm flex flex-col md:flex-row items-center gap-6">
                                        <div className="flex-1 text-left">
                                            <h3 className="text-green-700 font-bold text-xl mb-2">🎉 Semana Concluída!</h3>
                                            <p className="text-green-800 text-sm">Todos os setores foram verificados com sucesso. Ótimo trabalho!</p>
                                        </div>
                                        <div className="flex flex-col gap-3 w-full md:w-auto">
                                            <button onClick={() => setView('management_report')} className="w-full md:w-64 py-3 bg-green-600 text-white font-bold rounded-lg shadow hover:bg-green-500 transition-all flex items-center justify-center gap-2"><Icons.FileText /> Relatório Semanal</button>

                                        </div>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {allSetors.map(setor => {
                                        const isDone = setoresConcluidos.has(setor);
                                        const insp = inspectionsThisWeek.find(i => i.setor === setor);
                                        const displayScore = insp ? (insp.bonusScore !== undefined ? insp.bonusScore : insp.score) : 0;
                                        
                                        return (
                                            <button key={setor} onClick={() => isDone ? (setReportInspection(insp), setView('report')) : handleStartInspection(setor)} className={`w-full p-5 rounded-xl flex flex-col items-start justify-between card-shadow transition-all active:scale-95 border ${isDone ? 'bg-white border-yellow-500 shadow-md' : 'bg-white border-stone-200 hover:border-stone-400'}`}>
                                                <div className="flex items-center gap-3 w-full mb-4">
                                                    <div className={`h-12 w-12 shrink-0 rounded-full flex items-center justify-center ${isDone ? 'bg-yellow-100 text-yellow-700' : 'bg-stone-100 text-stone-500'}`}>{isDone ? <Icons.Check /> : <Icons.List />}</div>
                                                    <div className="text-left flex-1"><p className={`font-bold text-lg md:text-base ${isDone ? 'text-stone-900' : 'text-stone-700'}`}>{setor}</p></div>
                                                </div>
                                                <div className="w-full flex justify-between items-end border-t border-stone-100 pt-3">
                                                    {isDone ? (
                                                        <div className="flex flex-col gap-1 text-left">
                                                            <p className={`text-sm font-bold ${displayScore >= 85 ? 'text-green-600' : 'text-red-600'}`}>Nota: {displayScore}%</p>
                                                            <StarRating score={displayScore} />
                                                        </div>
                                                    ) : (
                                                        <span className="text-sm font-medium text-stone-400 italic">Pendente</span>
                                                    )}
                                                    {isDone ? <span className="text-[10px] bg-yellow-100 text-yellow-800 px-2 py-1 rounded font-bold border border-yellow-200">VER PDF</span> : <span className="h-8 w-8 rounded-full bg-stone-100 text-stone-400 flex items-center justify-center hover:bg-yellow-500 hover:text-white transition-colors">→</span>}
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </main>
                        </>
                    )}

                    {/* VIEW INSPECTION */}
                    {view === 'inspection' && (
                        <div className="flex flex-col h-screen relative">
                            <header className="sticky top-0 z-20 bg-white border-b border-stone-200 px-6 md:px-10 py-4 shadow-md flex justify-between items-center">
                                <div>
                                    <h2 className="text-xl md:text-2xl font-bold text-stone-800">{selectedSetor}</h2>
                                    <p className="text-sm text-stone-500">Auditor: {responsavel}</p>
                                </div>
                                <div className="flex items-center gap-6">
                                    <div className="text-right hidden md:block">
                                        <span className="text-[10px] font-bold text-stone-400 block uppercase">Real</span>
                                        <span className={`text-2xl font-black ${scores.real >= 85 ? 'text-green-600' : 'text-red-600'}`}>{scores.real}%</span>
                                    </div>
                                    <div className="text-right hidden md:block border-l pl-6 border-stone-200">
                                        <span className="text-[10px] font-bold text-yellow-700 block uppercase">Gratificação</span>
                                        <span className="text-3xl font-black text-yellow-600">{scores.bonus}%</span>
                                    </div>
                                    <div className="text-right flex flex-col items-end">
                                        <label className="text-[10px] text-stone-400 font-bold uppercase">Data</label>
                                        <input type="date" value={inspectionDate} onChange={(e) => setInspectionDate(e.target.value)} className="bg-transparent text-stone-600 text-sm md:text-base font-bold text-right outline-none" />
                                    </div>
                                </div>
                            </header>
                            
                            {/* SCORES PARA MOBILE */}
                            <div className="flex md:hidden justify-between items-center bg-white px-6 py-2 border-b border-stone-200">
                                <div className="text-center w-1/2 border-r border-stone-200"><span className={`text-2xl font-black ${scores.real >= 85 ? 'text-green-600' : 'text-red-600'}`}>{scores.real}%</span><span className="text-[10px] font-bold text-stone-400 block uppercase">Real</span></div>
                                <div className="text-center w-1/2"><span className="text-xl font-bold text-yellow-600">{scores.bonus}%</span><span className="text-[10px] font-bold text-yellow-700 block uppercase">Bônus</span></div>
                            </div>

                            <div className="bg-stone-100 px-6 py-4 sticky md:top-[90px] top-[130px] z-10 border-b border-stone-200">
                                <div className="relative shadow-sm max-w-2xl mx-auto md:mx-0">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400"><Icons.Search /></div>
                                    <input type="text" value={inspectionSearch} onChange={(e) => setInspectionSearch(e.target.value)} placeholder="Busca rápida por palavra (ex: limpeza)..." className="w-full pl-10 p-4 bg-white border border-stone-300 rounded-xl text-stone-800 outline-none focus:border-yellow-500 shadow-sm" />
                                </div>
                            </div>

                            <main className="flex-1 px-6 md:px-10 py-6 overflow-y-auto pb-32 bg-stone-100">
                                {/* LISTA DE PERGUNTAS GRID PARA TABLET */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                                    {filteredInspectionQuestions.map((q, idx) => {
                                        const prevNC = previousNCs[q.id];
                                        return (
                                        <div key={q.id} className="animate-fade-in bg-white p-5 rounded-xl shadow-sm border border-stone-200 hover:border-yellow-400 transition-colors">
                                            <div className="mb-4">
                                                <div className="flex gap-2 mb-2 flex-wrap">
                                                    <span className="text-[10px] font-bold text-yellow-700 bg-yellow-100 border border-yellow-200 px-2 py-1 rounded uppercase tracking-wider">{q.grupo}</span>
                                                    {q.critical && <span className="text-[10px] font-bold text-white bg-red-600 px-2 py-1 rounded uppercase flex items-center gap-1"><Icons.Alert /> CRÍTICO</span>}
                                                    <span className="text-[10px] font-bold text-stone-600 bg-stone-200 px-2 py-1 rounded uppercase border border-stone-300">Peso {q.weight || 1}</span>
                                                </div>
                                                <p className="text-stone-800 font-medium leading-relaxed text-sm md:text-base">{q.pergunta}</p>
                                            </div>
                                            {prevNC && <div className="mb-4 p-3 bg-yellow-50 border-l-4 border-yellow-400 rounded-r text-xs md:text-sm text-yellow-800 flex gap-3 items-start"><Icons.Alert /><div><span className="font-bold block text-yellow-700 mb-1">Atenção (Problema Recorrente):</span> "{prevNC}"</div></div>}
                                            <div className="flex gap-3">
                                                {['C', 'NC', 'NA'].map(opt => (
                                                    <button key={opt} onClick={() => setAnswers(p => ({...p, [q.id]: opt}))} className={`flex-1 py-4 rounded-lg font-bold text-sm md:text-base shadow-sm transition-all active:scale-95 ${answers[q.id] === opt ? (opt === 'C' ? 'bg-green-600 text-white shadow-md border-transparent' : opt === 'NC' ? 'bg-red-600 text-white shadow-md border-transparent' : 'bg-stone-600 text-white border-transparent') : 'bg-stone-50 border border-stone-300 text-stone-500 hover:bg-stone-100'}`}>{opt === 'C' ? 'Conforme' : opt === 'NC' ? 'Não Conforme' : 'N/A'}</button>
                                                ))}
                                            </div>
                                            {answers[q.id] === 'NC' && (
                                                <div className="mt-4 space-y-3 animate-fade-in p-4 bg-red-50 border border-red-100 rounded-xl">
                                                    <div className="flex items-center justify-between bg-white p-3 rounded-lg border border-red-200 shadow-sm">
                                                        <div className="flex items-center gap-2"><Icons.Alert /><span className="text-xs md:text-sm font-bold text-red-800">Qtd de Penalidades (x):</span></div>
                                                        <div className="flex items-center">
                                                            <button onClick={() => setNcQtys(p => ({...p, [q.id]: Math.max(1, (p[q.id] || 1) - 1)}))} className="w-10 h-10 bg-red-100 hover:bg-red-200 text-red-800 font-bold rounded-l transition-colors">-</button>
                                                            <input type="number" min="1" value={ncQtys[q.id] || 1} onChange={(e) => setNcQtys(p => ({...p, [q.id]: Math.max(1, parseInt(e.target.value) || 1)}))} className="w-14 h-10 text-center border-y border-red-200 text-red-800 font-bold outline-none bg-white" />
                                                            <button onClick={() => setNcQtys(p => ({...p, [q.id]: (p[q.id] || 1) + 1}))} className="w-10 h-10 bg-red-100 hover:bg-red-200 text-red-800 font-bold rounded-r transition-colors">+</button>
                                                        </div>
                                                    </div>
                                                    <textarea placeholder="Descreva o problema detalhadamente..." value={obs[q.id] || ''} onChange={(e) => setObs(p => ({...p, [q.id]: e.target.value}))} className="w-full text-sm md:text-base p-4 bg-white border border-red-200 rounded-lg text-red-800 focus:border-red-400 outline-none shadow-sm h-24 resize-none" />
                                                    {evidences[q.id] && evidences[q.id].length > 0 && (
                                                        <div className="flex gap-3 overflow-x-auto py-2">
                                                            {evidences[q.id].map((img, i) => (
                                                                <div key={i} className="relative w-20 h-20 md:w-24 md:h-24 shrink-0 cursor-pointer group" onClick={() => setLightboxImg(img)}>
                                                                    <img src={img} className="w-full h-full object-cover rounded-lg border border-stone-300 shadow-sm" />
                                                                    <button onClick={(e) => {e.stopPropagation(); removePhoto(q.id, i)}} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center font-bold shadow-md hover:bg-red-600 transition-colors">✕</button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                    <div className="flex gap-3">
                                                        <label className="flex-1 flex flex-col md:flex-row items-center justify-center gap-2 py-4 rounded-lg border-2 border-dashed border-red-300 text-red-700 bg-white hover:bg-red-50 cursor-pointer shadow-sm transition-colors"><input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handlePhotoUpload(q.id, e)} /><Icons.Camera /> <span className="text-xs md:text-sm font-bold">Tirar Foto</span></label>
                                                        <label className="flex-1 flex flex-col md:flex-row items-center justify-center gap-2 py-4 rounded-lg border-2 border-dashed border-red-300 text-red-700 bg-white hover:bg-red-50 cursor-pointer shadow-sm transition-colors"><input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhotoUpload(q.id, e)} /><Icons.Image /> <span className="text-xs md:text-sm font-bold">Galeria</span></label>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        );})
                                    }
                                </div>
                                <div className="mt-8 pt-8 max-w-2xl mx-auto">
                                    <h3 className="text-sm md:text-base font-bold text-stone-700 mb-4 flex items-center gap-2"><Icons.Pen /> Assinatura do Líder/Responsável</h3>
                                    <button type="button" onClick={() => setIsSigning(true)} className={`w-full py-5 rounded-xl border-2 flex items-center justify-center gap-3 transition-all ${signature ? 'bg-green-50 text-green-700 border-green-500 shadow-sm' : 'bg-white text-stone-600 border-stone-300 hover:bg-stone-50 hover:border-stone-400'}`}>
                                        {signature ? <><Icons.Check /> Assinatura Registrada</> : <><Icons.Pen /> Toque para Assinar</>}
                                    </button>
                                    {signature && <div className="mt-4 bg-white p-4 rounded-lg border border-stone-200"><img src={signature} className="h-20 md:h-24 mx-auto object-contain" /></div>}
                                </div>
                            </main>
                            <div className="absolute bottom-0 left-0 right-0 p-4 md:p-6 bg-white/90 backdrop-blur-md border-t border-stone-200 flex gap-4 max-w-5xl mx-auto shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] z-30">
                                <button onClick={handleCancelInspection} className="px-6 md:px-10 py-4 rounded-xl border-2 border-stone-300 font-bold text-stone-600 hover:bg-stone-100 transition-colors">Cancelar</button>
                                <button onClick={handleSaveInspection} className="flex-1 bg-yellow-500 text-white rounded-xl font-bold text-lg shadow-lg hover:bg-yellow-600 hover:shadow-xl transition-all">Salvar Inspeção na Nuvem</button>
                            </div>
                        </div>
                    )}

                    {/* SETTINGS */}
                    {view === 'settings' && (
                        <div className="min-h-screen bg-stone-100 flex flex-col">
                            <header className="bg-white p-6 flex items-center justify-between sticky top-0 z-10 shadow-md border-b border-stone-200">
                                <button onClick={() => setView('dashboard')} className="text-sm font-bold text-stone-500 hover:text-yellow-600">← Voltar para Dashboard</button>
                                <h1 className="font-bold text-xl text-yellow-600">Configurações do Sistema</h1>
                                <div className="w-20"></div>
                            </header>
                            <div className="flex border-b border-stone-200 bg-white sticky top-[76px] z-10 px-4 md:px-8">
                                <button onClick={() => setSettingsTab('history')} className={`flex-1 py-4 text-sm md:text-base font-bold border-b-4 transition-colors ${settingsTab === 'history' ? 'border-yellow-500 text-yellow-600' : 'border-transparent text-stone-500 hover:text-stone-700'}`}>Histórico de Auditorias</button>
                                <button onClick={() => setSettingsTab('questions')} className={`flex-1 py-4 text-sm md:text-base font-bold border-b-4 transition-colors ${settingsTab === 'questions' ? 'border-yellow-500 text-yellow-600' : 'border-transparent text-stone-500 hover:text-stone-700'}`}>Banco de Perguntas</button>
                                <button onClick={() => setSettingsTab('system')} className={`flex-1 py-4 text-sm md:text-base font-bold border-b-4 transition-colors ${settingsTab === 'system' ? 'border-yellow-500 text-yellow-600' : 'border-transparent text-stone-500 hover:text-stone-700'}`}>Sistema & Dados</button>

                                                <Icons.Upload /> Selecionar Arquivo JSON
                                                <input type="file" accept=".json" className="hidden" onChange={handleRestoreBackup} />
                                            </label>
                                        </div>

                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                                            <h2 className="font-bold text-stone-800 mb-4 flex items-center gap-2"><Icons.Database /> Banco em Nuvem Ativo</h2>
                                            <p className="text-sm text-stone-500 leading-relaxed mb-4">Seus dados estão protegidos. Salvamento e sincronização no Firebase do IMAC ocorrem em tempo real.</p>
                                            <div className="p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm font-bold flex items-center gap-2">
                                                <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> Conectado
                                            </div>
                                        </div>
                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-200 md:col-span-2 lg:col-span-1">
                                            <h2 className="font-bold text-stone-800 mb-4 flex items-center gap-2"><Icons.Excel /> Exportação de Dados Brutos</h2>
                                            <p className="text-sm text-stone-500 leading-relaxed mb-6">Baixe uma planilha detalhada com todas as respostas para cruzar dados livremente no Excel.</p>
                                            <button onClick={handleExportCSV} className="w-full py-4 bg-green-600 text-white font-bold rounded-lg shadow hover:bg-green-700 flex items-center justify-center gap-3 transition-colors"><Icons.Download /> Baixar CSV / Excel</button>

                                        <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-200 md:col-span-2 lg:col-span-1">

                                                <input type="file" accept="image/*" onChange={handleLogoUpload} className="hidden" />

                                            </label>
                                        </div>
                                    </div>
                                )}
                                {settingsTab === 'questions' && (
                                    <div className="space-y-6">
                                        <div className="flex flex-col md:flex-row gap-4 items-center">
                                            <div className="relative flex-1 w-full">
                                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-stone-400"><Icons.Search /></div>

                                            </div>
                                            <div className="flex-1 w-full">
                                                <select value={filterSector} onChange={(e) => setFilterSector(e.target.value)} className="w-full p-4 bg-white border border-stone-300 rounded-xl outline-none focus:border-yellow-500 shadow-sm text-stone-600 font-bold uppercase text-sm">
                                                    <option value="">VER TODOS OS SETORES</option>
                                                    {allSetors.map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                            <button onClick={() => setIsCloneModalOpen(true)} className="w-full md:w-auto px-6 py-4 bg-stone-800 text-white font-bold rounded-xl flex items-center justify-center gap-2 hover:bg-stone-700 shadow-sm transition-colors text-sm whitespace-nowrap">
                                                <Icons.Copy /> Usar Setor como Espelho
                                            </button>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {questions.filter(q => {
                                                const matchSearch = q.pergunta.toLowerCase().includes(searchTerm.toLowerCase()) || q.setor.toLowerCase().includes(searchTerm.toLowerCase()) || q.grupo.toLowerCase().includes(searchTerm.toLowerCase());
                                                const matchSector = filterSector === '' || q.setor === filterSector;
                                                return matchSearch && matchSector;
                                            }).map(q => (
                                                <div key={q.id} className="bg-white p-5 rounded-xl shadow-sm border border-stone-200 flex justify-between items-start hover:border-yellow-300 transition-colors">
                                                    <div className="flex-1 pr-4">
                                                        <div className="flex gap-2 mb-2 flex-wrap">
                                                            <span className="text-[10px] bg-stone-100 text-stone-600 px-2 py-1 rounded font-bold uppercase tracking-wider">{q.setor}</span>
                                                            <span className="text-[10px] bg-yellow-100 text-yellow-800 px-2 py-1 rounded font-bold uppercase tracking-wider">{q.grupo}</span>
                                                            {q.critical && <span className="text-[10px] bg-red-600 text-white px-2 py-1 rounded font-bold uppercase">CRÍTICO</span>}
                                                        </div>
                                                        <p className="text-sm font-medium leading-snug">{q.pergunta}</p>
                                                    </div>
                                                    <div className="flex flex-col gap-2 shrink-0">
                                                        <button onClick={() => { setEditingQ(q); setIsModalOpen(true); }} className="p-3 bg-stone-100 rounded-lg text-stone-500 hover:bg-yellow-100 hover:text-yellow-600 transition-colors"><Icons.Edit /></button>
                                                        <button onClick={() => handleDeleteQuestion(q.id)} className="p-3 bg-red-50 rounded-lg text-red-500 hover:bg-red-100 hover:text-red-700 transition-colors"><Icons.Trash /></button>
                                                    </div>
                                                </div>
                                            ))}
                                            
                                            {questions.filter(q => (filterSector === '' || q.setor === filterSector)).length === 0 && (
                                                <div className="md:col-span-2 text-center py-10 text-stone-500 font-bold bg-white rounded-xl border border-dashed border-stone-300">

                                                </div>
                                            )}
                                        </div>

                                    </div>
                                )}
                                {settingsTab === 'history' && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {inspections.sort((a,b) => new Date(b.data) - new Date(a.data)).map(insp => {
                                            const historyScore = insp.bonusScore !== undefined ? insp.bonusScore : insp.score;
                                            return (
                                            <div key={insp.id} className="bg-white p-5 rounded-xl shadow-sm border border-stone-200 flex flex-col justify-between hover:border-yellow-300 transition-colors">
                                                <div className="flex justify-between items-start mb-4">
                                                    <div>
                                                        <div className="font-bold text-lg mb-1">{insp.setor}</div>
                                                        <div className="text-sm text-stone-500">{new Date(insp.data).toLocaleDateString()}</div>
                                                        <div className="text-sm text-stone-500">Auditor: {insp.responsavel}</div>
                                                    </div>
                                                    <span className={`text-2xl font-black ${historyScore >= 85 ? 'text-green-600' : 'text-red-600'}`}>{historyScore}%</span>
                                                </div>
                                                <div className="flex gap-2 w-full pt-4 border-t border-stone-100">
                                                    <button onClick={() => { setReportInspection(insp); setView('report'); }} className="flex-1 py-2 bg-stone-100 rounded text-stone-700 font-bold text-sm hover:bg-stone-200 flex justify-center items-center gap-2"><Icons.FileText /> Abrir PDF</button>
                                                    <button onClick={() => handleDeleteAudit(insp.id)} className="px-4 bg-red-50 rounded text-red-600 hover:bg-red-100 transition-colors"><Icons.Trash /></button>
                                                </div>
                                            </div>
                                        )})}
                                    </div>
                                )}

                    {view === 'analytics' && (
                        <div className="min-h-screen bg-stone-100 flex flex-col animate-fade-in text-stone-900">
                            <header className="bg-white p-6 flex items-center justify-between sticky top-0 z-10 shadow-md border-b border-stone-200">
                                <button onClick={() => setView('dashboard')} className="text-sm font-bold text-stone-500 hover:text-yellow-600 transition-colors">← Voltar</button>
                                <h1 className="font-bold text-xl text-yellow-600">Indicadores de Qualidade</h1>
                                <div className="w-16"></div>
                            </header>

                            <div className="flex border-b border-stone-200 bg-white p-4 gap-4 sticky top-[76px] z-10 justify-center">
                                <button onClick={() => setAnalyticsTab('weekly')} className={`w-40 py-3 text-sm font-bold rounded-lg transition-colors ${analyticsTab === 'weekly' ? 'bg-yellow-500 text-white shadow-md' : 'bg-stone-100 text-stone-500 hover:bg-stone-200'}`}>Visão Semanal</button>
                                <button onClick={() => setAnalyticsTab('monthly')} className={`w-40 py-3 text-sm font-bold rounded-lg transition-colors ${analyticsTab === 'monthly' ? 'bg-yellow-500 text-white shadow-md' : 'bg-stone-100 text-stone-500 hover:bg-stone-200'}`}>Visão Mensal</button>
