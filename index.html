                                                <table className="w-full text-left border-collapse">
                                                    <thead>
                                                        <tr className="bg-stone-50 text-xs text-stone-500 uppercase border-y border-stone-200">
                                                            <th className="p-3 font-bold w-12 text-center">Pos.</th>
                                                            <th className="p-3 font-bold">Setor</th>
                                                            <th className="p-3 font-bold text-right">Média</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="text-sm text-stone-700">
                                                        {analytics.ranking.slice(0,5).map((insp, index) => (
                                                            <tr key={insp.setor} className="border-b border-stone-100 hover:bg-stone-50">
                                                                <td className="p-3 font-mono font-bold text-stone-400 text-center">{index + 1}º</td>
                                                                <td className="p-3 font-bold text-stone-800">{insp.setor}</td>
                                                                <td className={`p-3 text-right font-black ${insp.score >= 85 ? 'text-green-600' : 'text-red-600'}`}>{insp.score}%</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </main>
                        </div>
                    )}

                    {/* VIEW: REPORT (PDF INDIVIDUAL) FALLBACK */}
                    {view === 'report' && !reportInspection && (
                        <div className="flex h-screen items-center justify-center bg-white">
                            <div className="text-center">
                                <div className="animate-spin rounded-full h-12 w-12 border-b-4 border-yellow-500 mx-auto mb-4"></div>
                                <p className="text-gray-500 font-bold">Processando relatório...</p>
                            </div>
                        </div>
                    )}

                    {/* VIEW: REPORT (PDF INDIVIDUAL DO SETOR) */}
                    {view === 'report' && reportInspection && (
                        <div className="min-h-screen bg-white text-black p-4 md:p-8 w-full max-w-4xl mx-auto print-container md:shadow-lg md:my-8 border border-gray-200">
                            <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 no-print bg-gray-50 p-4 rounded-lg border">
                                <button onClick={() => setView('dashboard')} className="w-full md:w-auto bg-white border border-gray-300 text-gray-700 px-6 py-3 rounded-lg font-bold hover:bg-gray-100 transition-colors">← Voltar</button>
                                <button onClick={() => handleDownloadPDF('inspection-report-content', `Relatorio_${reportInspection.setor}_${reportInspection.data.split('T')[0]}.pdf`, false)} className="w-full md:w-auto bg-yellow-500 text-white font-bold px-6 py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-yellow-600 transition-colors shadow-md"><Icons.Download /> Gerar Arquivo PDF</button>
                            </div>
                            <div id="inspection-report-content" className="relative bg-white print-border p-2 md:p-8">

                                    <div>
                                        <h1 className="text-2xl md:text-3xl font-black uppercase tracking-tight">Inspeção de Qualidade</h1>
                                        <p className="text-sm md:text-base text-gray-600 font-bold mt-1">Checklist Setorial - IMAC</p>
                                    </div>
                                    {logo && <img src={logo} className="h-14 md:h-16 object-contain print-img-small" />}

                                <div className="relative z-10 grid grid-cols-2 md:grid-cols-4 gap-4 bg-gray-50 border border-gray-200 rounded-lg p-4 md:p-6 mb-8 print-header-grid">
                                    <div><span className="font-bold block text-xs uppercase text-gray-500 mb-1">Setor Auditado</span><span className="text-lg md:text-xl font-black text-gray-800">{reportInspection.setor}</span></div>

                                        <div className="flex items-center gap-2">
                                            <span className={(reportInspection.bonusScore !== undefined ? reportInspection.bonusScore : reportInspection.score) >= 85 ? 'text-green-700 font-black text-2xl' : 'text-red-700 font-black text-2xl'}>
                                                {reportInspection.bonusScore !== undefined ? reportInspection.bonusScore : reportInspection.score}%
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                        {Object.entries(reportInspection.respostas).filter(([_, v]) => v === 'NC').map(([qid, _]) => {
                                            const q = questions.find(qu => qu.id === qid);
                                            const qty = (reportInspection.ncQtys && reportInspection.ncQtys[qid]) || 1;
                                            return (
                                                <div key={qid} className="print-nc-item border-l-4 border-red-500 bg-gray-50 p-4 md:p-5 rounded-r-lg shadow-sm no-break">
                                                    <div className="flex gap-2 mb-2">
                                                        <span className="text-[10px] font-bold text-gray-600 bg-gray-200 px-2 py-1 rounded uppercase">{q?.grupo || 'GERAL'}</span>
                                                        {qty > 1 && <span className="text-[10px] font-black text-red-800 bg-red-200 px-2 py-1 rounded uppercase">x{qty} Ocorrências</span>}
                                                    </div>
                                                    <p className="font-bold text-sm md:text-base text-gray-900 leading-snug">{q?.pergunta}</p>
                                                    <div className="mt-3 bg-white p-3 border border-gray-200 rounded text-sm text-gray-700">
                                                        <span className="font-bold text-red-700 block mb-1">Observação do Auditor:</span> 
                                                        {reportInspection.observacoes[qid] || 'Nenhuma observação detalhada.'}
                                                    </div>
                                                    {reportInspection.evidencias && reportInspection.evidencias[qid] && (
                                                        <div className="mt-4 flex gap-2 flex-wrap">
                                                            {(Array.isArray(reportInspection.evidencias[qid]) ? reportInspection.evidencias[qid] : [reportInspection.evidencias[qid]]).map((img, i) => (
                                                                <img key={i} src={img} className="h-24 md:h-32 border border-gray-300 rounded shadow-sm bg-white object-cover print-img-evidence" />
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                    {Object.values(reportInspection.respostas).every(v => v !== 'NC') && (
                                        <div className="bg-green-50 border border-green-200 p-6 rounded-lg text-center">
                                            <p className="font-bold text-green-700 text-lg">Excelente! Setor 100% Conforme.</p>
                                            <p className="text-green-600 text-sm mt-1">Nenhum problema foi registrado durante a auditoria.</p>
                                        </div>
                                    )}
                                </div>

                                <div className="relative z-10 mt-16 pt-8 border-t border-gray-200 flex flex-col md:flex-row justify-around items-end gap-12 no-break bg-white p-2">
                                    <div className="text-center w-full md:w-1/3">
                                        <p className="font-bold text-sm mb-12">{reportInspection.responsavel}</p>
                                        <div className="border-t-2 border-black pt-2 text-xs font-bold uppercase tracking-widest text-gray-500">Assinatura do Auditor</div>
                                    </div>
                                    <div className="text-center w-full md:w-1/3">
                                        <div className="h-16 flex items-end justify-center mb-2">
                                            {reportInspection.assinatura && <img src={reportInspection.assinatura} className="h-16 object-contain print-img-small" />}
                                        </div>
                                        <div className="border-t-2 border-black pt-2 text-xs font-bold uppercase tracking-widest text-gray-500">Assinatura Líder do Setor</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIEW: MANAGEMENT REPORT (RELATÓRIO GERENCIAL COM TIPOS DE PERGUNTA) */}
                    {view === 'management_report' && (
                        <div className="min-h-screen bg-white text-black p-4 md:p-8 w-full max-w-5xl mx-auto print-container md:shadow-xl md:my-8 border border-gray-200">
                            <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 no-print bg-gray-50 p-4 rounded-lg border">
                                <button onClick={() => setView('analytics')} className="w-full md:w-auto bg-white border border-gray-300 text-gray-700 px-6 py-3 rounded-lg font-bold hover:bg-gray-100 transition-colors">← Voltar</button>
                                <div className="flex w-full md:w-auto flex-col md:flex-row gap-3">
                                    <button onClick={handleExportManagementExcel} className="bg-green-600 text-white font-bold px-6 py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-green-700 transition-colors shadow-md"><Icons.Excel /> Extrair p/ Excel</button>
                                    <button onClick={() => handleDownloadPDF('management-report-content', `Relatorio_Gerencial_IMAC.pdf`, false)} className="bg-blue-600 text-white font-bold px-6 py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-blue-700 transition-colors shadow-md"><Icons.Download /> Gerar Livro PDF</button>
                                </div>
                            </div>

                            <div id="management-report-content" className="relative bg-white print-scale-down">

                                    <div className="flex justify-between items-end border-b-4 border-black pb-4 mb-8">
                                        <div>
                                            <h1 className="text-3xl md:text-4xl font-black uppercase tracking-tight">Dossiê de Qualidade</h1>
                                            <p className="text-base font-bold text-gray-500 uppercase tracking-widest mt-2">Relatório Gerencial - Nível Diretoria</p>
                                        </div>
                                        {logo && <img src={logo} className="h-16 md:h-20 object-contain" />}
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 bg-gray-50 p-6 rounded-lg border border-gray-200">
                                        <div><span className="block text-xs uppercase font-bold text-gray-400 mb-1">Período de Análise</span><span className="text-lg font-bold text-gray-800">{analyticsTab === 'weekly' ? 'Semana de ' + getWeekRangeFromDate(analyticsSelectedDate) : 'Mês: ' + selectedMonth}</span></div>
                                        <div><span className="block text-xs uppercase font-bold text-gray-400 mb-1">Data de Emissão</span><span className="text-lg font-bold text-gray-800">{new Date().toLocaleDateString()}</span></div>
                                    </div>

                                    <div className="mb-10">
                                        <h2 className="text-xl font-black uppercase border-b-2 border-gray-200 pb-2 mb-4 text-gray-800">1. Resumo Executivo da Operação</h2>
                                        <p className="text-gray-700 leading-relaxed text-justify">{analytics.summaryText}</p>
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                                        <div className="bg-white border-2 border-gray-200 p-6 rounded-xl text-center shadow-sm">
                                            <div className="text-4xl font-black text-gray-800 mb-1">{analytics.avgScore}%</div>
                                            <div className="text-xs uppercase font-bold text-gray-500">Média Geral</div>
                                        </div>
                                        <div className="bg-yellow-50 border-2 border-yellow-200 p-6 rounded-xl text-center shadow-sm">
                                            <div className="text-4xl font-black text-yellow-700 mb-1">{analytics.avgBonusScore}%</div>
                                            <div className="text-xs uppercase font-bold text-yellow-800">Média (Gratificação)</div>
                                        </div>
                                        <div className="bg-white border-2 border-gray-200 p-6 rounded-xl text-center shadow-sm">
                                            <div className="text-4xl font-black text-gray-800 mb-1">{analytics.ranking.length}</div>
                                            <div className="text-xs uppercase font-bold text-gray-500">Setores Auditados</div>
                                        </div>
                                        <div className="bg-white border-2 border-gray-200 p-6 rounded-xl text-center shadow-sm">
                                            <div className="text-3xl font-black text-red-600 mb-1 leading-tight flex items-center justify-center h-[40px]">{analytics.pieCategory.length > 0 ? analytics.pieCategory[0].value : 0}</div>
                                            <div className="text-xs uppercase font-bold text-gray-500">Pior Categoria (NCs)</div>
                                        </div>
                                    </div>

                                    <div className="mb-10">
                                        <h2 className="text-xl font-black uppercase border-b-2 border-gray-200 pb-2 mb-4 text-gray-800">2. Ranking de Performance (Geral)</h2>
                                        <div className="overflow-hidden border-2 border-gray-200 rounded-xl">
                                            <table className="w-full text-left text-sm">
                                                <thead className="bg-gray-100 text-gray-600 uppercase text-xs">
                                                    <tr>
                                                        <th className="p-4 font-bold text-center w-16">Pos.</th>
                                                        <th className="p-4 font-bold">Setor</th>
                                                        <th className="p-4 font-bold text-right">Nota Final</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-200 bg-white">
                                                    {analytics.ranking.map((r, i) => (
                                                        <tr key={i} className="hover:bg-gray-50 transition-colors">
                                                            <td className="p-4 text-center font-mono font-bold text-gray-500">{i + 1}º</td>
                                                            <td className="p-4 font-bold text-gray-900">{r.setor}</td>
                                                            <td className={`p-4 text-right font-black text-lg ${r.score >= 85 ? 'text-green-600' : 'text-red-600'}`}>{r.score}%</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    <div className="h-10"></div>
                                </div>

                                {/* SEÇÃO NOVA: ANÁLISE DETALHADA POR SETOR (COM QUEBRA DE PÁGINA) */}
                                {Object.entries(analytics.sectorAnalysisData).filter(([_, data]) => data.count > 0).map(([setor, data]) => {
                                    
                                    // Agrupa os problemas para criar uma tabelinha "Grupo vs NCs" específica do setor
                                    const gruposNoSetor = Object.entries(data.ncByCategory).sort((a,b) => b[1] - a[1]);

                                    return (
                                    <div key={setor} className="p-4 md:p-8 border border-gray-300 print:border-none print:p-0 mb-8 page-break-before relative">
                                        <div className="bg-gray-800 text-white p-4 rounded-t-xl flex justify-between items-center mb-6 print:bg-transparent print:text-black print:border-b-4 print:border-black print:rounded-none print:p-0 print:pb-2">
                                            <h2 className="text-2xl font-black uppercase tracking-wider">{setor}</h2>
                                            <span className="text-sm font-bold opacity-80 uppercase tracking-widest">Relatório Analítico</span>
                                        </div>

                                        <div className="grid grid-cols-3 gap-4 mb-8">
                                            <div className="bg-gray-50 border border-gray-200 p-4 rounded-lg text-center print:border-2">
                                                <div className="text-xs font-bold text-gray-500 uppercase mb-1">Score do Setor</div>
                                                <div className={`text-3xl font-black ${data.avgScore >= 85 ? 'text-green-600' : 'text-red-600'}`}>{data.avgScore}%</div>
                                            </div>
                                            <div className="bg-gray-50 border border-gray-200 p-4 rounded-lg text-center print:border-2">
                                                <div className="text-xs font-bold text-gray-500 uppercase mb-1">Nº Inspeções</div>
                                                <div className="text-3xl font-black text-gray-800">{data.count}</div>
                                            </div>
                                            <div className="bg-red-50 border border-red-200 p-4 rounded-lg text-center print:border-2">
                                                <div className="text-xs font-bold text-red-800 uppercase mb-1">Total Penalidades</div>
                                                <div className="text-3xl font-black text-red-600">{data.totalNC}</div>
                                            </div>
                                        </div>

                                        {data.totalNC > 0 ? (
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                                {/* Tabela de Resumo por Grupo */}
                                                <div className="md:col-span-1">
                                                    <h3 className="font-bold text-sm uppercase text-gray-600 border-b border-gray-300 pb-2 mb-4">Gargalos (Por Tipo)</h3>
                                                    <table className="w-full text-sm border-collapse border border-gray-200">
                                                        <thead className="bg-gray-100 text-gray-600 text-[10px] uppercase">
                                                            <tr>
                                                                <th className="p-2 text-left font-bold border-b border-gray-200">Classificação</th>
                                                                <th className="p-2 text-center font-bold border-b border-gray-200">Qtd (NC)</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-gray-100">
                                                            {gruposNoSetor.map(([grupo, qtd]) => (
                                                                <tr key={grupo}>
                                                                    <td className="p-2 font-bold text-gray-800 text-xs">{grupo}</td>
                                                                    <td className="p-2 text-center font-black text-red-600">{qtd}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>

                                                {/* Lista detalhada das Perguntas */}
                                                <div className="md:col-span-2">
                                                    <h3 className="font-bold text-sm uppercase text-gray-600 border-b border-gray-300 pb-2 mb-4 flex items-center gap-2"><Icons.Alert /> Detalhamento de Falhas</h3>
                                                    <div className="space-y-4">
                                                        {data.ncs.map((nc, idx) => (
                                                            <div key={idx} className="border-l-4 border-red-500 bg-gray-50 p-4 rounded-r shadow-sm print:border print:border-l-4 print:border-gray-300 no-break">
                                                                <div className="flex gap-2 items-center mb-1">
                                                                    <span className="text-[10px] bg-white border border-gray-300 text-gray-600 px-2 py-0.5 rounded font-bold uppercase">{nc.grupo}</span>
                                                                    {nc.qty > 1 && <span className="text-[10px] bg-red-100 text-red-800 px-2 py-0.5 rounded font-black uppercase">x{nc.qty} Penalidades</span>}
                                                                </div>
                                                                <p className="font-bold text-sm text-gray-900 leading-snug">{nc.pergunta}</p>
                                                                <p className="text-xs text-gray-600 mt-2 bg-white p-2 border border-gray-200 rounded"><span className="font-bold text-gray-800">Apontamento:</span> {nc.obs || 'Sem observação documentada.'}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="bg-green-50 border-2 border-green-200 p-8 rounded-xl text-center my-8">
                                                <div className="text-green-500 flex justify-center mb-4 scale-150"><Icons.Check /></div>
                                                <p className="font-black text-green-700 text-xl mb-2">Setor Livre de Não Conformidades!</p>
                                                <p className="text-green-600">O {setor} atingiu a conformidade máxima nas auditorias do período.</p>
                                            </div>
                                        )}

                                        {/* Espaço para Assinatura do Líder e Planejamento */}
                                        <div className="mt-12 pt-6 border-t border-dashed border-gray-300 no-break">
                                            <h3 className="font-bold text-sm uppercase text-gray-600 mb-4">Feedback e Plano de Ação (A ser preenchido pelo Líder do {setor})</h3>
                                            <div className="w-full h-24 bg-gray-50 border border-gray-200 rounded mb-8 print:border-black"></div>
                                            <div className="flex justify-between items-end px-10">
                                                <div className="text-center w-64">
                                                    <div className="border-t border-black pt-2 text-xs font-bold uppercase text-gray-500">Data de Recebimento</div>
                                                </div>
                                                <div className="text-center w-64">
                                                    <div className="border-t border-black pt-2 text-xs font-bold uppercase text-gray-500">Assinatura Responsável ({setor})</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )})}

                            </div>
                        </div>
                    )}

                    {/* MODAIS (Criação de Pergunta) */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate-fade-in">
                                <h2 className="text-xl font-black mb-6 text-yellow-600 uppercase tracking-tight">{editingQ ? 'Editar Pergunta' : 'Criar Nova Pergunta'}</h2>
                                <form onSubmit={handleSaveQuestion} className="space-y-5">
                                    <div><label className="block text-xs font-bold text-stone-500 uppercase mb-2">Setor Destino</label><input name="setor" defaultValue={editingQ?.setor || ''} list="setores-list" className="w-full p-4 bg-stone-50 border border-stone-300 rounded-xl outline-none focus:ring-2 focus:ring-yellow-500 transition-all font-bold uppercase" required placeholder="Ex: ESTOQUE" /><datalist id="setores-list">{allSetors.map(s => <option key={s} value={s} />)}</datalist></div>
                                    <div><label className="block text-xs font-bold text-stone-500 uppercase mb-2">Categoria/Grupo da Pergunta</label><input name="grupo" defaultValue={editingQ?.grupo || ''} className="w-full p-4 bg-stone-50 border border-stone-300 rounded-xl outline-none focus:ring-2 focus:ring-yellow-500 transition-all font-bold uppercase" required placeholder="Ex: LIMPEZA, ORGANIZAÇÃO, ESTRUTURAL..." /></div>
                                    <div><label className="block text-xs font-bold text-stone-500 uppercase mb-2">A Pergunta (Checklist)</label><textarea name="pergunta" defaultValue={editingQ?.pergunta || ''} className="w-full p-4 bg-stone-50 border border-stone-300 rounded-xl h-28 resize-none outline-none focus:ring-2 focus:ring-yellow-500 transition-all text-sm leading-relaxed" required placeholder="O que o auditor deve verificar?" /></div>
                                    
                                    <div className="flex gap-4 items-center bg-stone-50 p-4 rounded-xl border border-stone-200">
                                        <div className="w-1/3">
                                            <label className="block text-xs font-bold text-stone-500 uppercase mb-2">Peso (Pts)</label>
                                            <input type="number" name="weight" defaultValue={editingQ?.weight || 1} min="1" className="w-full p-3 bg-white border border-stone-300 rounded-lg outline-none focus:ring-2 focus:ring-yellow-500 font-bold text-center" />
                                        </div>
                                        <div className="flex-1 flex items-center justify-center gap-3 pt-4 cursor-pointer">
                                            <input type="checkbox" name="critical" id="critical" defaultChecked={editingQ?.critical} className="w-6 h-6 text-red-600 rounded cursor-pointer" />
                                            <label htmlFor="critical" className="text-sm font-black text-red-700 uppercase cursor-pointer">Item Crítico</label>
                                        </div>
                                    </div>

                                    <div className="flex gap-3 pt-4"><button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 py-4 border-2 border-stone-200 text-stone-600 rounded-xl font-bold hover:bg-stone-50 transition-colors">Cancelar</button><button type="submit" className="flex-1 py-4 bg-yellow-500 text-white rounded-xl font-bold hover:bg-yellow-600 shadow-md transition-colors">Salvar no Banco</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL DIDÁTICO: CLONAR SETOR (USAR COMO ESPELHO) */}
                    {isCloneModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate-fade-in">
                                <div className="flex items-center gap-3 text-stone-800 mb-4">
                                    <div className="p-3 bg-yellow-100 text-yellow-700 rounded-lg"><Icons.Copy /></div>
                                    <h2 className="text-xl font-black uppercase">Clonar Setor Inteiro</h2>
                                </div>
                                <p className="text-sm text-stone-500 mb-8 leading-relaxed">Crie um novo setor do zero, copiando automaticamente **todas** as perguntas, categorias e pesos de um setor que já existe no sistema (Setor Espelho).</p>
                                
                                <form onSubmit={handleCloneSector} className="space-y-6">
                                    <div>
                                        <label className="block text-xs font-bold text-stone-500 uppercase mb-2">1. Setor Espelho (Copiar de...)</label>
                                        <select value={cloneSourceSector} onChange={e => setCloneSourceSector(e.target.value)} required className="w-full p-4 bg-stone-50 border border-stone-300 rounded-xl outline-none focus:ring-2 focus:ring-yellow-500 font-bold uppercase text-sm">
                                            <option value="">Clique para escolher...</option>
                                            {allSetors.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-stone-500 uppercase mb-2">2. Nome do NOVO Setor (Destino)</label>
                                        <input type="text" value={cloneTargetSector} onChange={e => setCloneTargetSector(e.target.value)} required placeholder="Ex: ESTOQUE FILIAL 2" className="w-full p-4 bg-white border border-stone-300 rounded-xl outline-none focus:ring-2 focus:ring-yellow-500 uppercase font-bold text-sm shadow-inner" />
                                    </div>
                                    
                                    <div className="flex gap-3 pt-4">
                                        <button type="button" onClick={() => setIsCloneModalOpen(false)} className="flex-1 py-4 border-2 border-stone-200 text-stone-600 rounded-xl font-bold hover:bg-stone-50 transition-colors">Cancelar</button>
                                        <button type="submit" className="flex-1 py-4 bg-stone-900 text-white rounded-xl font-bold hover:bg-stone-800 shadow-md transition-all active:scale-95 flex items-center justify-center gap-2"><Icons.Copy /> Executar Clone</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ToastProvider>
                <AppContent />
            </ToastProvider>
        );
    </script>
</body>
</html>
